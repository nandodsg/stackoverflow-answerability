<script id="data" type="application/json">{"set": "scoring", "rubric_version": "fd79297623f7", "rubric_text": "# Quality-label rubric (P3)\n\nSix judgments about how a Stack Overflow question is written, made from its **original title and body** (the\nMarkdown the asker first posted, before any edit). The same text and the same definitions are used by the hand\nlabeler (the gold set) and by every labeling model, so their labels can be compared. This file is the single source\nof the definitions: the labeling prompt reads it as is.\n\nCurated from the ten candidates of the discovery pass (`labels/output/discovery/candidate_labels.md`); what was kept,\nmerged or dropped, and why, is at the end.\n\n## How to judge\n\n- **Writing, not topic.** Judge how the question is written, never what it is about. Do not ask whether the\n  technology is niche, the problem is hard, or the question is likely a duplicate.\n- **Text only.** Judge only what the text shows. Images are not visible: a link to an image counts as \"an image\", and\n  you do not know what it shows beyond what the text says about it.\n- **No expertise needed.** Judge from what the post says, not from what you know about the tool, its versions or its\n  libraries. Do not judge whether the code has a bug, whether the request is possible, or whether the approach is\n  right. A reader with no knowledge of the tag should reach the same answer.\n- **Each label on its own.** One label's answer never decides another's.\n- **Do not reward** length, effort described, research links, polished English, headings or tone: they are not what\n  these labels measure.\n- **Always pick a level.** When unsure, apply the label's borderline rule; there is no \"can't tell\".\n\n## The labels\n\nEach label has a storage key, its levels (the first is the **reference level**, against which the other levels'\nrates are compared in the analysis), a decision rule and the borderline cases. `not_applicable` levels are left out\nof that label's comparison.\n\n### 1. `worked_example` — input and desired output written out\n\nLevels: `no` (reference) / `yes`\n\n- **yes** only if both are written out in text or code: (a) at least one concrete input (data, a value, a string, an\n  array, a table, file lines) and (b) the literal output the asker wants for that input (a table, an array, a string,\n  a value). One value is enough: \"`-$97.90` should become `($97.90)`\" is **yes**.\n- **no** if the desired output is only described in words (\"grouped by user\", \"make it thinner\"), if the input or\n  output is only in an image, or if either is missing.\n- Runnable code, an error message, a list of patterns or a description of the goal is not a worked example by\n  itself. This label asks for an input/output pair, not for a reproducible example.\n- A bug report's expected-versus-actual counts only if the expected value is written literally.\n- *Borderline:* input written but the output left for the reader to infer (an example sentence, but the word to\n  extract from it never written): **no**. **yes** only if a reader could type both the input and the expected output\n  from the post without guessing.\n\n### 2. `ask_scope` — what is being asked\n\nLevels: `narrow` (reference) / `broad` / `multiple` / `no_clear_ask`\n\nDecide in this order and stop at the first that fits:\n\n1. **no_clear_ask**: the body states neither the problem nor the goal in its own words. It is only pasted code,\n   output, a log or an error, with at most a filler line (\"not working\", \"getting this error\", \"any help?\"), and\n   the request lives only in the title.\n2. **multiple**: two or more independent things to answer, or a sprawling list of concerns. Follow-ups that the main\n   answer would settle anyway count as one (the same fix asked for two elements is one ask).\n3. **broad**: a single ask that needs a design discussion or a whole feature, app or system built (\"how should I\n   structure…\", \"how do I build a…\"), **or** an ask framed as a request for an opinion or a recommendation: the best\n   or a better way, a tool, library or tutorial to use, \"anyone have an example\", \"is this good practice\", \"do you\n   think this is reliable\".\n4. **narrow**: one specific question that a short answer (a function, a setting, a fix, a fact, a paragraph of\n   explanation) could fully resolve.\n\n- A problem described in prose followed by \"any help?\" asks for a fix of that problem: judge its scope like any other\n  ask. \"The result should be like this\", with the result written out, is a stated ask.\n- A conceptual \"why does X…\" or \"what is X\" question that a paragraph answers is **narrow**.\n- A request to write one function or algorithm for a stated operation, even a non-trivial one, is **narrow**; broad\n  is for designing a system or building a feature with several parts.\n- *Borderline:* a main question plus a side question (\"also, is this good practice?\", \"suggestions welcome\"):\n  **narrow** if the side question is minor and clearly secondary; **multiple** if it would need its own answer of\n  similar length.\n- *Borderline:* \"is there a better way to do this?\" about working code: **broad** if no concrete deficiency is\n  named; **narrow** if a specific problem is stated (too slow, wrong output). A how-to that only mentions \"best\" in\n  passing while asking for a specific operation is **narrow**.\n\n### 3. `failure_description` — how the failure is described\n\nLevels: `concrete` (reference) / `vague` / `not_applicable`\n\nDecide in this order:\n\n1. **not_applicable** if the post does not report something going wrong: a how-to, conceptual or design question\n   with no attempt that failed. A constraint (\"eval is disabled on my server\") is not a failure. A how-to that shows\n   an attempt and says what it did (\"it is very thick\", \"it only replaces the first one\") does report a failure.\n2. **concrete**: the failure is named in observable terms: the exact error text, a wrong value or output, or a\n   described symptom (\"stops after item 2 and never runs 3 and 4\", \"never updates the jti\", \"shows too many\n   decimals\", \"does not cover the app bar\"). An expected behaviour is welcome but not required.\n3. **vague**: the only description is a phrase like \"doesn't work\", \"not working\", \"is not supporting\", \"crashes\",\n   \"an error\", \"nothing shows\", \"not a proper response\", with no symptom.\n\n- *Borderline:* a paraphrased error that still names the problem (\"says something about quota\") is **concrete**. An\n  error shown only in an image, with no text describing it, is **vague**.\n\n### 4. `code_focus` — code focused on the problem\n\nLevels: `focused` (reference) / `partial` / `dump` / `not_applicable`\n\n- **not_applicable** if the post has no code: no code block and no pasted code of two lines or more. Code includes\n  source, queries, markup, config files and data literals. Logs, debug traces and error output are not code: a post\n  whose only blocks are logs is **not_applicable**.\n- Judge relevance, not raw length: does most of the code bear on the stated problem?\n- **focused**: short, only the relevant parts, self-contained or runnable; a non-expert can see where the problem\n  lives.\n- **partial**: relevant but long, or slightly fragmentary; a whole config file or component where the problem sits\n  in one line or one import and the rest is related but not needed.\n- **dump**: a whole app, file or page; large unrelated sections (a full stylesheet, a whole manifest, generated\n  HTML, big data arrays); the question buried after a large paste; or fragments missing the very pieces the question\n  is about.\n- *Borderline:* a long but complete runnable script where everything is used: **partial**, not dump, unless large\n  parts are clearly unrelated to the question.\n\n### 5. `environment_dependent` — about the asker's own setup\n\nLevels: `no` (reference) / `yes`\n\n- **yes** if the problem, as the post describes it, is about the asker's own setup: installing, upgrading or\n  versioning software; configuring or deploying (servers, containers, hosting, cloud services, build tools); networks\n  and firewalls; a specific OS, machine or device; or files and attachments the post does not include and the\n  problem hinges on.\n- **no** if the problem is about code, a query or a behaviour that a reader could reproduce from the post or answer\n  from general knowledge, even when the code happens to read a local file or talk to a server.\n- Judge from what the post says: do not answer **yes** because you know a feature depends on a version, unless the\n  post itself mentions installs, versions, upgrades or its setup.\n- *Borderline:* a build or config error that quotes a complete, minimal config file: **no** if that config alone\n  would reproduce the error; **yes** if the error depends on what is installed or deployed on the asker's side.\n\n### 6. `image_only_evidence` — essential evidence only in an image\n\nLevels: `no` (reference) / `yes`\n\n- **yes** if the post points to an image for something the question hinges on and never gives it in text: the error\n  (\"I get this error:\" followed by an image and no error text), the sample data, or the code.\n- **no** if there is no image, or the images are mockups of a desired screen, illustrations of a visible symptom,\n  diagrams the question is about, or repeat what the text already says.\n- Test: cover the images. If you can still tell from the text what the error, the data or the code is, the answer is\n  **no**.\n- Image tags inside pasted code (an `<img>` element in HTML or JSX) are code, not images.\n- *Borderline:* a screenshot of a layout bug next to the HTML and CSS in text: **no**; the essential code is in text\n  and the image only illustrates.\n\n## From the discovery candidates to this rubric\n\n| Candidate (discovery pass) | Decision | Reason |\n|---|---|---|\n| 1 Worked example of the desired result | kept as `worked_example` | Strongest signal (20 of 21 pairs favored the accepted question). |\n| 2 Single narrowly scoped ask | kept as `ask_scope` | 22 of 28; judgeable without tag knowledge. |\n| 9 Recommendation or opinion framing | merged into `ask_scope` = `broad` | Weakest kept signal (10 of 16) and a kind of broad ask; merging adds no judgment per post. |\n| 6 Explicit ask stated in the body | merged into `ask_scope` = `no_clear_ask` | Most posts have one, so alone it only flags a thin tail; as a level it costs nothing extra. |\n| 3 Concrete failure description | kept as `failure_description` | 15 of 20; the value is in avoiding vagueness, not in quoting an error. |\n| 4 Code focused on the problem | kept as `code_focus` | 19 of 27; splits the ~70% of questions with code, which the rules cannot split further. |\n| 5 Depends on the asker's environment | kept as `environment_dependent` | 14 of 18 (here \"yes\" goes with the unanswered question). |\n| 7 Essential evidence only in an image | kept as `image_only_evidence`, judged from text | 8 of 10; refines the rule-based has-image feature, which alone is neutral. Neither the hand labeler nor a model sees the images. |\n| 8 Code readable as posted | dropped | Largely mechanical and close to the rule-based code features; overlaps `code_focus`. |\n| 10 Asker-imposed restriction on fixes | dropped | 6 pairs only, and \"arbitrary versus justified\" is hard to judge consistently. |\n\nCounts are approximate, taken from one model's free-form notes over 200 pairs; the gold set and the analysis set\nmeasure each label properly. Labels 1 and 5 lean toward some tags (data manipulation; ops), which the analysis's\ncontrol by primary tag accounts for. Ideas the discovery pass rejected as mixed or reversed (effort shown, research\nlinks, prose polish, structure, tone, a bare error quote) are listed in its candidates file.\n\n**Practice round (2026-10-31).** The first wording (version 5102cea87d4f) was tried on the 20 practice questions by\nthe hand labeler and one model, blind to each other. Their disagreements showed where the wording left room, and it\nwas tightened before the scoring set: `worked_example` asks for an input/output pair, not a reproducible example;\n`ask_scope` treats a problem described in prose, a written-out desired result and a conceptual question as clear,\nnarrow asks; `failure_description` merges \"specific\" and \"partial\" into `concrete`, since the discovery signal is\nvague versus not vague; `code_focus` says logs are not code; `environment_dependent` is judged from what the post says\nabout its setup, not from knowledge of the tool; `image_only_evidence` gets the \"cover the images\" test. The outcome\nhint in \"Do not reward\" was removed.\n", "review": {"models": [{"id": "google/gemini-4-argon", "short": "gemini"}, {"id": "spacexai/grok-4.7", "short": "grok"}], "q": {"68258046": {"worked_example": [["no", "Shows a sample object in the array, but does not write out the literal desired output array."], ["no", "Example object given; desired result never written"]], "ask_scope": [["narrow", "Asks how to change a property on an inserted object without mutating existing objects in the array."], ["narrow", "One specific mutation problem a short fix resolves"]], "failure_description": [["concrete", "Explains that changing the property on the inserted object also mutates the existing object in the array."], ["concrete", "Existing cart object's qty also changes"]], "code_focus": [["focused", "Provides only the short, directly relevant service class and method call."], ["focused", "Short service and call show the push logic"]], "environment_dependent": [["no", "The problem is about JavaScript/TypeScript object mutation in code, not the local setup."], ["no", "Code behavior, not install or machine setup"]], "image_only_evidence": [["no", "The post contains no images."], ["no", "No images in the post"]]}, "59720878": {"worked_example": [["no", "No input data and desi rked_example": [["no", "No concrete input or literal output is written out in text or code."], ["no", "No concrete input paired with a literal expected output."]], "ask_scope": [["narrow", "Asks a specific how-to question about logging debug details when debug mode is false."], ["narrow", "One how-to: log exception details when debug is off."]], "failure_description": [["not_applicable", "Pure how-to question about logging configuration with no failed attempt described."], ["not_applicable", "How-to about logging; no failed attempt is described."]], "code_focus": [["not_applicable", "The post contains no code blocks or pasted code of two lines or more."], ["not_applicable", "No code block or multi-line pasted code."]], "environment_dependent": [["no", "Asks about general framework behavior and configuration rather than a specific machine setup."], ["no", "General Laravel exception-logging behavior, not the asker's setup."]], "image_only_evidence": [["no", "The image only illustrates the standard debug screen; the question does not hinge on it."], ["no", "Screenshot only illustrates the debug screen already described in text."]]}, "58762459": {"worked_example": [["no", "The post describes a build error with no input and desired output data pair."], ["no", "No concrete input paired with a literal expected output."]], "ask_scope": [["narrow", "Asks how to resolve a specific Android build dependency error in Ionic 4."], ["narrow", "One specific build-failure fix, not a design or multi-part ask."]], "failure_description": [["concrete", "The title names the exact error message: 'Failed to notify dependency resolution listener'."], ["concrete", "Title names the dependency-resolution error and the build failure."]], "code_focus": [["not_applicable", "There are no code blocks or multi-line code snippets in the post."], ["not_applicable", "No code block and no multi-line pasted code."]], "environment_dependent": [["yes", "The issue is about building an Android release and dependency resolution on the asker's setup."], ["yes", "Release build failure depends on the asker's project and build setup."]], "image_only_evidence": [["yes", "The body explicitly states the specific build errors are shown marked in red in the screenshot."], ["yes", "The errors are only in the screenshot, not transcribed."]]}}}, "labels": [{"key": "worked_example", "title": "input and desired output written out", "levels": ["no", "yes"], "section": "Levels: `no` (reference) / `yes`\n\n- **yes** only if both are written out in text or code: (a) at least one concrete input (data, a value, a string, an\n  array, a table, file lines) and (b) the literal output the asker wants for that input (a table, an array, a string,\n  a value). One value is enough: \"`-$97.90` should become `($97.90)`\" is **yes**.\n- **no** if the desired output is only described in words (\"grouped by user\", \"make it thinner\"), if the input or\n  output is only in an image, or if either is missing.\n- Runnable code, an error message, a list of patterns or a description of the goal is not a worked example by\n  itself. This label asks for an input/output pair, not for a reproducible example.\n- A bug report's expected-versus-actual counts only if the expected value is written literally.\n- *Borderline:* input written but the output left for the reader to infer (an example sentence, but the word to\n  extract from it never written): **no**. **yes** only if a reader could type both the input and the expected output\n  from the post without guessing."}, {"key": "ask_scope", "title": "what is being asked", "levels": ["narrow", "broad", "multiple", "no_clear_ask"], "section": "Levels: `narrow` (reference) / `broad` / `multiple` / `no_clear_ask`\n\nDecide in this order and stop at the first that fits:\n\n1. **no_clear_ask**: the body states neither the problem nor the goal in its own words. It is only pasted code,\n   output, a log or an error, with at most a filler line (\"not working\", \"getting this error\", \"any help?\"), and\n   the request lives only in the title.\n2. **multiple**: two or more independent things to answer, or a sprawling list of concerns. Follow-ups that the main\n   answer would settle anyway count as one (the same fix asked for two elements is one ask).\n3. **broad**: a single ask that needs a design discussion or a whole feature, app or system built (\"how should I\n   structure…\", \"how do I build a…\"), **or** an ask framed as a request for an opinion or a recommendation: the best\n   or a better way, a tool, library or tutorial to use, \"anyone have an example\", \"is this good practice\", \"do you\n   think this is reliable\".\n4. **narrow**: one specific question that a short answer (a function, a setting, a fix, a fact, a paragraph of\n   explanation) could fully resolve.\n\n- A problem described in prose followed by \"any help?\" asks for a fix of that problem: judge its scope like any other\n  ask. \"The result should be like this\", with the result written out, is a stated ask.\n- A conceptual \"why does X…\" or \"what is X\" question that a paragraph answers is **narrow**.\n- A request to write one function or algorithm for a stated operation, even a non-trivial one, is **narrow**; broad\n  is for designing a system or building a feature with several parts.\n- *Borderline:* a main question plus a side question (\"also, is this good practice?\", \"suggestions welcome\"):\n  **narrow** if the side question is minor and clearly secondary; **multiple** if it would need its own answer of\n  similar length.\n- *Borderline:* \"is there a better way to do this?\" about working code: **broad** if no concrete deficiency is\n  named; **narrow** if a specific problem is stated (too slow, wrong output). A how-to that only mentions \"best\" in\n  passing while asking for a specific operation is **narrow**."}, {"key": "failure_description", "title": "how the failure is described", "levels": ["concrete", "vague", "not_applicable"], "section": "Levels: `concrete` (reference) / `vague` / `not_applicable`\n\nDecide in this order:\n\n1. **not_applicable** if the post does not report something going wrong: a how-to, conceptual or design question\n   with no attempt that failed. A constraint (\"eval is disabled on my server\") is not a failure. A how-to that shows\n   an attempt and says what it did (\"it is very thick\", \"it only replaces the first one\") does report a failure.\n2. **concrete**: the failure is named in observable terms: the exact error text, a wrong value or output, or a\n   described symptom (\"stops after item 2 and never runs 3 and 4\", \"never updates the jti\", \"shows too many\n   decimals\", \"does not cover the app bar\"). An expected behaviour is welcome but not required.\n3. **vague**: the only description is a phrase like \"doesn't work\", \"not working\", \"is not supporting\", \"crashes\",\n   \"an error\", \"nothing shows\", \"not a proper response\", with no symptom.\n\n- *Borderline:* a paraphrased error that still names the problem (\"says something about quota\") is **concrete**. An\n  error shown only in an image, with no text describing it, is **vague**."}, {"key": "code_focus", "title": "code focused on the problem", "levels": ["focused", "partial", "dump", "not_applicable"], "section": "Levels: `focused` (reference) / `partial` / `dump` / `not_applicable`\n\n- **not_applicable** if the post has no code: no code block and no pasted code of two lines or more. Code includes\n  source, queries, markup, config files and data literals. Logs, debug traces and error output are not code: a post\n  whose only blocks are logs is **not_applicable**.\n- Judge relevance, not raw length: does most of the code bear on the stated problem?\n- **focused**: short, only the relevant parts, self-contained or runnable; a non-expert can see where the problem\n  lives.\n- **partial**: relevant but long, or slightly fragmentary; a whole config file or component where the problem sits\n  in one line or one import and the rest is related but not needed.\n- **dump**: a whole app, file or page; large unrelated sections (a full stylesheet, a whole manifest, generated\n  HTML, big data arrays); the question buried after a large paste; or fragments missing the very pieces the question\n  is about.\n- *Borderline:* a long but complete runnable script where everything is used: **partial**, not dump, unless large\n  parts are clearly unrelated to the question."}, {"key": "environment_dependent", "title": "about the asker's own setup", "levels": ["no", "yes"], "section": "Levels: `no` (reference) / `yes`\n\n- **yes** if the problem, as the post describes it, is about the asker's own setup: installing, upgrading or\n  versioning software; configuring or deploying (servers, containers, hosting, cloud services, build tools); networks\n  and firewalls; a specific OS, machine or device; or files and attachments the post does not include and the\n  problem hinges on.\n- **no** if the problem is about code, a query or a behaviour that a reader could reproduce from the post or answer\n  from general knowledge, even when the code happens to read a local file or talk to a server.\n- Judge from what the post says: do not answer **yes** because you know a feature depends on a version, unless the\n  post itself mentions installs, versions, upgrades or its setup.\n- *Borderline:* a build or config error that quotes a complete, minimal config file: **no** if that config alone\n  would reproduce the error; **yes** if the error depends on what is installed or deployed on the asker's side."}, {"key": "image_only_evidence", "title": "essential evidence only in an image", "levels": ["no", "yes"], "section": "Levels: `no` (reference) / `yes`\n\n- **yes** if the post points to an image for something the question hinges on and never gives it in text: the error\n  (\"I get this error:\" followed by an image and no error text), the sample data, or the code.\n- **no** if there is no imag           <input class=\"btn btn-primary w-100\" type=\"submit\" value=\"Confirm\"><\/input>\n                                    <\/div>\n                                <\/div>\n                            <\/div>\n                        <\/div>\n                    <\/div>\n                <\/form>\n            <\/div>\n            <div class=\"col-md-5\">\n                <div class=\"section-header d-flex mb-5\">\n                    <h1 class=\"h-04 flex-grow-1\">Awards<\/h1>\n                <\/div>\n                <table class=\"table\">\n                    <thead>\n                        <tr>\n                            <th scope=\"col\">Award name<\/th>\n                            <th scope=\"col\">Description<\/th>\n                            <th scope=\"col\"><\/th>\n                        <\/tr>\n                    <\/thead>\n                    <tbody>\n                        @if (Model.Awards != null)\n                        {\n                            foreach (var item in Model.Awards)\n                            {\n                                <tr>\n                                    <td>@item.Name<\/td>\n                                    <td>@item.Description<\/td>\n                                    <td>\n                                        <a class=\"btn btn-outline-primary btn-sm\">Edit<\/a>\n                                        <a class=\"btn btn-outline-primary btn-sm\">Remove<\/a>\n                                    <\/td>\n                                <\/tr>\n                            }\n                        }\n                    <\/tbody>\n                <\/table>\n            <\/div>\n        <\/div>\n    <\/div>\n<\/section>\n```\n\nMethod in controller:\n```\n        [HttpPost]\n        public async Task<IActionResult> Create(ActivityForm data)\n        {\n            var award = data.Award;\n\n            if (award.Name != null && award.Description != null)\n            {\n                if (data.Awards == null) data.Awards = new List<AwardForm>();\n\n                data.Awards.Add(new AwardForm { Name = award.Name, Description = award.Description });\n\n                data.Award.Name = \"\";\n                data.Award.Description = \"\";\n\n                return View(data);\n            }\n\n\n            if (!ModelState.IsValid)\n            {\n                return View(data);\n            }\n\n            string userId = User.FindFirstValue(ClaimTypes.NameIdentifier);\n\n            await service.NewActivityAsync(data, userId);\n            return RedirectToAction(nameof(Index));\n        }\n```\n\nModel\n\n```\n    public class ActivityForm\n    {\n        public string Name { get; set; }\n\n        public string Description { get; set; }\n\n        public DateTime StartDate { get; set; }\n\n        public DateTime EndDate { get; set; }\n\n        public int Points { get; set; }\n\n        public AwardForm Award { get; set; }\n\n        public List<AwardForm> Awards { get; set; }\n    }\n```\n\nEverything was now working as intended but I had one more issue left. When I try to add another Award to the list, the list is returned to the controller method as null. \n\nI'm not really sure if the issue is related to binding, I have noticed that every other value is bound and is returning the expected value except the list which is not bound."}, {"id": 55411003, "rank": 11, "year": 2019, "tags": ["python", "sql", "sqlalchemy"], "title": "How to select column in sqlalchemy exists", "body": "The [SQLAlchemy exists docs](https://docs.sqlalchemy.org/en/latest/orm/query.html#sqlalchemy.orm.query.Query.exists) say that using `exists` creates a SQL statement with `EXISTS (SELECT 1 ...)`. How can I get `EXISTS` to select a column of my choosing?\n\nI have two models likes so:\n\n```\nclass Query:\n    id = Column(UUID)\n    content = Column(String)\n    ...\n\nclass Review:\n    id = Column(UUID)\n    query_id = Column(UUID, ForeignKey('query.id'))\n    ...\n```\n\nI'm trying to perform a complex query which requires getting all the `id`s `Query`s  which don't have a `Review`. To do this I've written the following python:\n\n```python\n\nreviewed_query_ids_sql_query = session.query(models.Review.query_id)\n\nfiltered_queries_sql_query = session.query(models.Query.id).where(~reviewed_query_ids_sql_query.exists())\n```\n\nbut that's producing the following SQL for `filtered_queries_sql_query`:\n\n```\nSELECT queries.id \nFROM queries \nWHERE (EXISTS (SELECT 1 \nFROM reviews))\n```\n\nHowever, the raw query for `reviewed_query_ids_sql_query` is\n\n```\nSELECT reviews.query_id AS reviews_query_id \nFROM reviews\n```\n\nHow come the exists does a `SELECT 1` when the underlying query does a `SELECT <column>`? What I'd like for the query to do is `SELECT query_id FROM reviews` in the query with the `EXISTS` clause. How can I achieve that?"}, {"id": 50926788, "rank": 12, "year": 2018, "tags": ["c#", "zip"], "title": "C# open embedded zip-files", "body": "I have a program where I need to search an arbitrary number of nested zip-files. I was able to solve this in python 3 by taking the namelist of the archive at a given path, finding zip-files, opening them, converting the file to a byte string with BytesIO, and then calling the method again recursively on the bytestring. Like so:\n\n    def zip_dig(source_path, posts):\n\n    try:\n        with zipfile.ZipFile(source_path, 'r') as zip_ref:  # Open initial zip file, list contents\n            for name in zip_ref.namelist():\n                if re.search(r'\\.zip$', name) is not None:\n                    if name.endswith('.zip'):\n                        zfiledata = BytesIO(zip_ref.read(name))\n                        zip_dig(zfiledata, posts)\n    except zipfile.BadZipFile:\n        pass\n    return posts\n\nI now need to solve this in C#, but I can't seem to find any equivalent solution. \n\nI have googled extensively and looked through the documentation of the ZipFile and ZipArchive classes, but I can't seem to find similar workaround for the fact that the file reference comes in the form of a Stream rather than a String:\n\n    internal static List<BsonDocument> ZipDig(string path, List<BsonDocument> posts)\n        {\n            path = Path.GetFullPath(path);\n\n            using (ZipArchive archive = ZipFile.OpenRead(path))\n            {\n                foreach (ZipArchiveEntry entry in archive.Entries)\n                {\n                    if (entry.FullName.EndsWith(\".zip\", StringComparison.OrdinalIgnoreCase))\n                    {\n\n                        posts = ZipDig(entry, posts);\n                    }\n                }\n            }\n\n\n                return posts;\n        }\nAny help is appreciated!"}, {"id": 61867164, "rank": 13, "year": 2020, "tags": ["ios", "xcode", "header", "accessibility", "swipe"], "title": "iOS accessibility nav bar heading swipe down not working", "body": "I'm using the rotator tool to enable swipe up or down between accessibility elements with accessibility trait set to .header.  This works fine - in both up and down directions for cells within a tableview. And it works fine when you transition from the first cell UP to the nav bar title. But if you then try to swipe DOWN from the nav bar title to the first cell, it says \"heading not found\" and remains stuck in the nav bar. Left / right swipes transition correctly across all elements."}, {"id": 62255052, "rank": 14, "year": 2020, "tags": ["html", "css", "google-chrome", "machine-learning", "computer-vision"], "title": "After pressing tab on a website, how to get the html focused element's background and the border color?", "body": "I am trying to automate website accessibility checks for which I need to know the color contrast of the focused element(after the tab press) with its border color.\n\nApproach:\n\n 1. Earlier I was trying to capture the screenshot of an entire website before and after the tab press.\n 2. Then I did image comparison using computer vision and cropped the image difference but this approach won't work on a website where content is dynamically changing.\n\nSo, I read about Chrome inbuilt behavior when the user presses the tab to enhance user accessibility experience (It adds border-color blue/orange/white over the focused component).  \nSo I am looking for suggestions whether this can be done via HTML source code instead of image comparison.  \n\nIn the following images, chrome adds the white border over the focused element whereas the background color is green.\n\n\n[Before Tab Press][2]\n\n[After Tab Press][3]\n\n\n  [2]: https://i.stack.imgur.com/TEn8T.png\n  [3]: https://i.stack.imgur.com/sVGKZ.jpg"}, {"id": 69821469, "rank": 15, "year": 2021, "tags": ["javascript", "file", "electron", "project", "drag"], "title": "default electron drag project not working as intended", "body": "the default electron file drag project (https://github.com/electron/electron/tree/v15.3.0/docs/fiddles/features/drag-and-drop) should from my understanding have a drag icon when the user is dragging a file, however after copying the project per vadum the drag icon does not show up, has there been a change, does it just not work or am I missing something?\n\nI'm using the latest build of windows 10"}, {"id": 59075482, "rank": 16, "year": 2019, "tags": ["envoyproxy", "grpc-web"], "title": "How to call grpc-web proxy from a NodeJS server", "body": "I'm running gRPC server that implements the service interface and a Envoy proxy that allows the client to connect, the following js code (file `health.js`) builded using webpack and referenced `dist/main.js` into HTML file make success call and it's work\n\n    const { HealthCheckRequest, HealthCheckReply } = require(\"./protobuf/service_pb\")\n    const { ProtoClient } = require(\"./protobuf/service_grpc_web_pb\")\n    var client = new ProtoClient('http://localhost:8080');\n    \n    var request = new HealthCheckRequest()\n    client.healthCheck(request, {}, (err, response) => {\n        console.log(response)\n    })\n\nI would like to execute this function in a NodeJS server and not in a browser, in fact executing the command `node health.js` the following error occurred \n\n    ...\n    ReferenceError: XMLHttpRequest is not defined\n    ..."}, {"id": 48844194, "rank": 17, "year": 2018, "tags": ["flask", "vue.js", "pycharm"], "title": "PyCharm - Proper highlighting for mixed Flask and Vue.js code?", "body": "Is there a way to have Flask and Vue.js code highlight properly within PyCharm?\n\n[![enter image description here][1]][1]\n\n\n  [1]: https://i.stack.imgur.com/GPn8b.png"}, {"id": 66815431, "rank": 18, "year": 2021, "tags": ["javascript", "angular", "typescript", "angular5"], "title": "Angular 5 lazy loading not working. Shared module not working", "body": "We are trying to implement lazy load in our project. But I am having a strange error. Basically, I have created a module for a component and used loadchildren in app.module. But there is another component used in that component in Html like this \n\n    <cr-configure-button><\/cr-configure-button>\n\nSo for this component, I am getting this error \n\n    Can't bind to 'hub' since it isn't a known property of 'cr-configure-button'.\n    1. If 'cr-configure-button' is an Angular component and it has 'hub' input, then verify that it is part of this module.\n    2. If 'cr-configure-button' is a Web Component then add 'CUSTOM_ELEMENTS_SCHEMA' to the '@NgModule.schemas' of this component to suppress this message.\n    3. To allow any property add 'NO_ERRORS_SCHEMA' to the '@NgModule.schemas' of this component\n  \nFor this component, I have created a shared module that is exporting this component. Please see the code below\n\nPlease help.\n\nThank you in advance\n\n  app.module.ts\n\n     { path: 'modules', loadChildren: './hubs/hubs.module#HubsModule' },\n\nhubs.module.ts\n\n    import { NgModule } from '@angular/core';\n    import { CommonModule } from '@angular/common';\n    \n    import { HubsRoutingModule } from './hubs-routing.module';\n    import { HubsComponent } from './hubs.component';\n    import { SharedModule } from '@shared/shared.module';\n    \n    @NgModule({\n      imports: [\n        CommonModule,\n        HubsRoutingModule,\n        SharedModule,\n      ],\n    \n      declarations: [\n        HubsComponent,\n      ],\n    \n    })\n    export class HubsModule { }\n\nshared.moudule.ts\n\n    import { NgModule } from '@angular/core';\n    import { CommonModule } from '@angular/common';\n    import { CrConfigureButtonComponent } from './components/buttons/cr-configure-button';\n    \n    @NgModule({\n      imports: [\n        CommonModule,\n      ],\n      declarations: [CrConfigureButtonComponent],\n      exports: [CrConfigureButtonComponent],\n    })\n    export class SharedModule { }"}, {"id": 66134202, "rank": 19, "year": 2021, "tags": ["r", "path", "rstudio"], "title": "RStudio keeps adding `/usr/local/bin` to the front of the PATH variable", "body": "When I run system commands from RStudio using system(\"...\"), I would like RStudio to use a certain version of Python. \n\nWhen I open RStudio (just by clicking on the icon on a Mac) and set the PATH variables with Sys.setenv(PATH=\"my_python_path\"), this works successfully. To make this the default variable, I tried updating both my ~/.Renviron (Using PATH=...) and ~/.Rprofile (using Sys.setenv(\"...\")) pre-pending the path to the Python I would like to use. \n\nUpdating the PATH variables in .Renviron and .Rprofile takes effect, but RStudio nevertheless keeps pre-pending `/usr/local/bin` to the front of the PATH variable, which directs R to the default system Python in that directory. The Python path I specified comes right after that and does not get used.\n\nIs there a way to make RStudio respect the PATH order that I specified in my .Renviron or .Rprofile?"}, {"id": 62518380, "rank": 20, "year": 2020, "tags": ["angular", "ngx-bootstrap"], "title": "ngx-bootstrap bsValueChange being called repeatedly", "body": "I am using ngx bootstrap to display a date picker an an Angular 8 component.\n\n```html\n<input type=\"text\" formControlName=\"startDate\" class=\"form-control date-field\"\n    maxlength=\"10\" placeholder=\"MM/DD/YYYY\" #dpEffective=\"bsDatepicker\" bsDatepicker\n    [bsConfig]=\"dateOptions\" (bsValueChange)=\"setDate($event)\"\n    triggers=\"\" autocomplete=\"off\" />\n```\n\nWhen the user changes the date, the ```setDate``` method is first called with the correct date (the date the user entered) as the ```$event``` parameter, but will be called repeatedly from the template with the current date (client system date). Is this an intended behavior of ```bsValueChange```? Is is possible to disable this?\n\nThanks"}, {"id": 52801633, "rank": 21, "year": 2018, "tags": ["mysql"], "title": "Mysql delete similar rows according to specific columns except the ones with highest id", "body": "my table has duplicate row values in specific columns. i would like to remove those rows and keep the row with the latest id.\nthe columns i want to check and compare are: \n\n    sub_id, spec_id, ex_time\n\nso, for this table\n\n    +----+--------+---------+---------+-------+\n    | id | sub_id | spec_id | ex_time | count |\n    +----+--------+---------+---------+-------+\n    |  1 |    100 |     444 | 09:29   |     2 |\n    |  2 |    101 |     555 | 10:01   |    10 |\n    |  3 |    100 |     444 | 09:29   |    23 |\n    |  4 |    200 |     321 | 05:15   |     5 |\n    |  5 |    100 |     444 | 09:29   |     8 |\n    |  6 |    101 |     555 | 10:01   |     1 |\n    +----+--------+---------+---------+-------+\n\ni would like to get this result\n\n    +----+--------+---------+---------+-------+\n    | id | sub_id | spec_id | ex_time | count |\n    +----+--------+---------+---------+-------+\n    |  5 |    100 |     444 | 09:29   |     8 |\n    |  6 |    101 |     555 | 10:01   |     1 |\n    +----+--------+---------+---------+-------+\n\ni was able to build this query to select all duplicate rows from multiple columns, according to this [question][1]\n\n    select  t.*\n    from mytable t join\n         (select id, sub_id, spec_id, ex_time, count(*) as NumDuplicates\n          from mytable\n          group by sub_id, spec_id, ex_time\n          having NumDuplicates > 1\n         ) tsum\n         on t.sub_id = tsum.sub_id and t.spec_id = tsum.spec_id and t.ex_time = tsum.ex_time  \n\nbut now im not sure how to wrap this select with a delete query to delete the rows except for the ones with highest id.\nas [shown here][2]\n\n\n\n  [1]: https://stackoverflow.com/questions/16324328/mysql-select-records-for-duplicates-using-multiple-columns\n  [2]: https://stackoverflow.com/questions/38804666/mysql-delete-duplicate-records-except-one-has-max-time"}, {"id": 73705863, "rank": 22, "year": 2022, "tags": ["java", "spring", "spring-boot", "servlets", "javabeans"], "title": "What is the default scope for a spring controller component?", "body": "I'm diving into the spring bean scopes and application contexts topics and try to understand some concepts. \n\nI understood that there is three main contexts. ApplicationContext (which is the context for a standalone app), WebApplicationContext for web based app (that extends ApplicationContext) and ServletContext (that is not Spring Related but a JEE thing, also related to web applications).\n\na WebApplicationContext contains all the Web related beans (controllers, ViewResolver etc ....), extends an ApplicationContext and reference a ServletContext\n\nan ApplicationContext contains beans with singleton and prototype scope and\na WebApplicationContext adds three scopes : request, session, websocket and application but application scoped beans are related to the ServletContext referenced in the WebApplicationContext.\n\nWhat I'm not sure to understand is : \n- if controller components are contained in the WebApplicationContext, what is their default scope ? I thought it was singleton but in this case it makes no sense because the WebApplicationContext that contains those beans dies when the server is shut down\n\n- the documentation says that application scope is *\"somewhat similar to a Spring singleton bean but differs in two important ways: It is a singleton per ServletContext, not per Spring ApplicationContext (for which there may be **several in any given web application**), and it is actually exposed and therefore visible as a ServletContext attribute.\" Its clear, but I do not understand how we can have multiple servletContext for one applicationContext, I didn't find any use case for that. I've seen a usecase for multiple WebApplicationContext in the same app, like an app whith a REST API and a web front, but in this case, there is only one applicationContext and (I thought) only one servletContext shared by multiple WebApplicationContext."}, {"id": 71752411, "rank": 23, "year": 2022, "tags": ["javascript", "es6-modules"], "title": "Why ECMAScript ES module import do not follow destructuring standard?", "body": "In JavaScript I can rename and imported module this way\n\n    import { original_name as alias_name } from 'my_module'\n\nIs there a good explanation for the need of as keyword and nod just follow the excellent destructuring standard?\n\nWhy not something like this:\n\n    import { original_name: alias_name } from 'my_module'\n\nJust a curiosity always come to my mind"}, {"id": 48989171, "rank": 24, "year": 2018, "tags": ["django", "django-models", "python-unittest", "django-testing", "django-unittest"], "title": "Unit Testing Django Model Save Function", "body": "I'm creating tests to check that a custom calibration model save function updates an asset record (foreign key) if it is the latest calibration record for the asset.  The save function performs exactly as expected in live dev & production server and even in the django shell, but appears to fail during testing...\n\nmodels.py\n\n    class Asset(models.Model):\n        ...\n        requires_calibration = models.BooleanField()\n        passed_calibration = models.BooleanField(default=False)\n        calibration_date_prev = models.DateField(null=True, blank=True)\n        calibration_date_next = models.DateField(null=True, blank=True)\n\n\n    class CalibrationRecord(models.Model):\n        calibration_record_id = models.AutoField(primary_key=True)\n        asset = models.ForeignKey(\n                                  \"myapp.Asset\",\n                                  on_delete=models.CASCADE,\n                                  limit_choices_to={\"requires_calibration\": True}\n                                  )\n        calibration_date = models.DateField(default=timezone.now)\n        calibration_date_next = models.DateField(null=True, blank=True)\n        calibration_outcome = models.CharField(max_length=10, default=\"Pass\")\n\n        def save(self, *args, **kwargs):\n\n            super(CalibrationRecord, self).save(*args, **kwargs)\n\n            # Check if this is the latest calibration record for any asset, if so update asset.calibration_dates and status\n            latest_asset_calibration = CalibrationRecord.objects.filter(asset=self.asset.pk).order_by(\n                \"-calibration_date\", \"-calibration_record_id\")[0]\n\n            if self.pk == latest_asset_calibration.pk:\n\n                Asset.objects.filter(pk=self.asset.pk).update(calibration_date_prev=self.calibration_date)\n\n                if self.calibration_date_next:\n                    Asset.objects.filter(pk=self.asset.pk).update(calibration_date_next=self.calibration_date_next)\n                else:\n                    Asset.objects.filter(pk=self.asset.pk).update(calibration_date_next=None)\n\n                if self.calibration_outcome == \"Pass\":\n                    Asset.objects.filter(pk=self.asset.pk).update(passed_calibration=True)\n                else:\n                    Asset.objects.filter(pk=self.asset.pk).update(passed_calibration=False)\n    \ntests_models.py example failing test\n\n    class CalibrationRecordTests(TestCase):\n        def test_calibration_record_updates_asset_cal_date_prev(self):\n            \"\"\"\n            All calibration records should update related Asset record's \"calibration_date_prev\" to calibration_date\n            \"\"\"\n            asset1 = Asset.objects.create(asset_description=\"Test Asset 2\", requires_calibration=True)\n            self.assertIsNone(asset1.calibration_date_prev)\n            cal = CalibrationRecord.objects.create(asset=asset1, calibration_description=\"Test Calibration 2\", calibration_date=timezone.now())\n            self.assertEqual(cal.calibration_date, asset1.calibration_date_prev)\n\nError log\n\n    ======================================================================\n    FAIL: test_calibration_record_updates_asset_cal_date_prev (assetregister.tests_models.CalibrationRecordTests)\n    ----------------------------------------------------------------------\n    Traceback (most recent call last):\n      File \"C:\\[path]\\app\\tests_models.py\", line 159, in test_calibration_record_updates_asset_cal_date_prev\n    self.assertEqual(cal.calibration_date, asset1.calibration_date_prev)\n    AssertionError: datetime.datetime(2018, 2, 26, 12, 26, 34, 457513, tzinfo=<UTC>) != None\n    ======================================================================\n\nAll of my tests relating to this custom calibration record save function appear to fail because the related asset record isn't updated when it should be.\n\nAny ideas why this would work during dev and production but not during testing?\n\nEven though the .create() method should automatically do a .save() after, I even tried doing a manual .save() after creating the calibration record, but it still seems to fail."}, {"id": 68297160, "rank": 25, "year": 2021, "tags": ["python", "seaborn", "heatmap"], "title": "Add a black frame around a colorbar", "body": "I have created a heatmap and a colorbar in two separate axes. I want to create a black frame around each of the plots. I've succeeded in ax0 (the heatmap) but for ax1 (the colorbar) it doesn't work. See picture. Thanks for helpers :)\n\n    import numpy as np\n    import pandas as pd\n    import matplotlib.pyplot as plt\n    import seaborn as sns\n    \n    df = pd.DataFrame(np.random.randn(10, 2), columns=list('AB'))\n    fig, (ax0, ax1) = plt.subplots(ncols=2, figsize=(10, len(PT) / 5.2), gridspec_kw={'width_ratios': [15, 15]})\n    sns.heatmap(df, annot=False, cmap='RdYlGn', cbar_ax=ax1, ax=ax0)\n    for _, spine in ax1.spines.items():\n        spine.set_visible(True)\n    for _, spine in ax0.spines.items():\n        spine.set_visible(True)\n\n\n  [1]: https://i.stack.imgur.com/LazEG.png"}, {"id": 60344916, "rank": 26, "year": 2020, "tags": ["r", "dplyr", "tidyr"], "title": "selecting cases that have 2 or more", "body": "Should be simple but I'm not getting anywere\n\n\n`df <- data.frame(date=rep(1:3,1),\n                 RID=rep(c(\"Amy\", \"Bob\"), each=3),\n                 A=c(1, 3, 1, NA, 1, 3))`\n              \n\n       date | RID   |A|\n     1 |Amy |1|\n     2 |Amy |3|\n     3 |Amy |1|\n     1 |Bob |NA|\n     2 |Bob |1|\n     3 |Bob |1|\n\n\nI just want to select the RID's that have both one (or more) 1 and a 3 in the \"A\" collumn"}, {"id": 59995557, "rank": 27, "year": 2020, "tags": ["java", "ssl", "https", "java-8"], "title": "Java (JDK1.8) is not setting server_name extension in SSL handshake when hostname has '_'", "body": "```\n    CloseableHttpClient httpclient = HttpClients.createDefault();\n       HttpGet httpget = new HttpGet(url);\n    System.out.println(httpclient.execute(httpget));\n```\n\nI am using this programming snippet and using this with couple of urls. \"https://abc.def.com/file.txt\" and \"https://ab_c.def.com/file.txt\" (actual names i used exist - this is just an example). When i run the code with -Djavax.net.debug=ss rorMessage) {\n      this.errorInfoDto = formErrorInfoDto(errorCode, errorMessage);\n     }\n     \n     private ErrorInfoDto formErrorInfoDto(int errorCode, String errorMessage) {\n      ErrorInfoDto errorInfoDto = null;\n      errorInfoDto = new ErrorInfoDto();\n      errorInfoDto.setErrorCode(errorCode);\n      errorInfoDto.setErrorMessage(errorMessage);\n      return errorInfoDto;\n      \n     }\n     \n     public ErrorInfoDto getErrorInfoDto() {\n      return errorInfoDto;\n     }\n    }"}, {"id": 48784152, "rank": 40, "year": 2018, "tags": ["xamarin.forms", "nuget-package", "ibeacon"], "title": "Xamarin.Forms and iBeacons", "body": "Could anyone suggest me a Xamarin NuGet package to monitor iBeacons?\n\nI have tried Plugin.BLE to scan for beacons. Is there a way to monitor the proximity of beacon?"}, {"id": 59527750, "rank": 41, "year": 2019, "tags": ["python", "django", "django-rest-framework", "decimal", "choicefield"], "title": "How to provide choices to django rest framework DecimalField serializer?", "body": "Django==2.2.6\n\ndjangorestframework==3.10.3\n\nModels.py\n\n    VAT_CHOICES = [(Decimal('0.00'), '0%'), (Decimal('6.00'), '6%'), (Decimal('12.00'), '12%'), (Decimal('25.00'), '25%')]\n    class Service(models.Model):\n        vat = models.DecimalField(verbose_name=_('vat'), decimal_places=2, max_digits=10, choices=VAT_CHOICES)\n\nserializers.py\n\n    class ServiceSerializer(serializers.ModelSerializer):\n        vat = serializers.DecimalField(decimal_places=2, max_digits=10, coerce_to_string=True)\n        \n\nIf I do this then the value of vat in response is in srting as expected but the choices validation does not implied then.\n\nNow I can create a service with vat=\"5.00\" which should not be possible because there is a choice list in the model.\n\nHow can I have the string representation of the decimal field vat but keep the choices validation?"}, {"id": 59328317, "rank": 42, "year": 2019, "tags": ["serilog"], "title": "Serilog: writing to c ank": 57, "year": 2021, "tags": ["reactjs", "next.js", "server-side-rendering"], "title": "React Next.js - Three related questions about SSR patterns", "body": "the following question about the usage of next.js and react to achieve SSR build on top of each other, so I thought I'd write that into a single post. My main question is the third one, but I feel I need to first understand the first two questions in order to get there. So here we go:\n\n\n<b>1. Am I right that the whole page is always reexecuted from scratch after the client has received it?<\/b>  \n\nConsider this next.js page component:\n\n```\nconst Page = () => {\n  const [state, setState] = useState(getState());\n\n  function getState() {\n    console.log(\"compute initial state\");\n    return 1;\n  }\n\n  return <>{state}<\/>;\n};\n\n```\nAs far as I can tell, `getState()` is executed both on the server and on the client. If I'd want to exectue that computation only on the server I'd have to do it via `getInitialProps()`resp. `getServersideProps()`, right?\n\n<b>2. What value does the prerendered document have for the client if it will be immediately thrown away?<\/b>\n\nTaking the first question a step further, why is the prerendered document event handed to the client if it will be recalculated from scratch anyway. What advantages does it have for the client to get that initial document? Ok if the case the client can't execute js at all they at least have something. But is that all?\n\n<b>3. Does this mean I unnecessarily have to \"double render\" some components on the client side?<\/b>\n\nLet's say parts of my code depend on `window` and can't be executed on the server. As explained in different [articles][1] I found, it can lead to problems (and react warnings) if I rely on checks like `typeof window === \"undefined\"` in my code. Instead I think the better way is to execute those functionalities after the first render with a `useEffect`:\n\n```\nconst Page = () => {\n    const [value, setValue] = useState();\n\n    // Effect will be executed after the first render, e.g. never on the server\n    useEffect(() => {\n        const value = window.innerWidth; // Some computations or subscriptions that depend on window\n        setValue(value)\n    }, []);\n\n    return (\n        <>\n            {!value && <h1>value pending ...<\/h1>}\n            {value && <h1>{value}<\/h1>}\n        <\/>\n    );\n};\n```\n\nNow, with this pattern the app is fine from an SSR perspective. BUT I am introducing additional effort that has do be done on the client side: Even though `window` is defined on first render, it can only be used on second render.\n\nFor this smaller example this doesn't play a big role, but in a larger app, a flickering may be visible because an unnecessary first render is updated some milliseconds later. Furthermore the code becomes harder to read and more error-prone.\n\nThe solution I would want here is related to the first question above: Can I somehow avoid the app from starting from scratch but directly start with the second render? Is there some kind of pattern for this that I've missed so far?\n\nNote: Of course I could rewrite the component to simply check if `window` is defined:\n```\n  return (\n    <>\n      <h1>{window ? window.innerWidth : \"value pending ...\"}<\/h1>\n    <\/>\n  );\n```\n\nHowever this will cause a react warning and cause other problems as described in the article i have liked above. I'd prefer to not do that.\n\nThank you a lot for your help!\n\n\n  [1]: https://tech.willhaben.at/how-to-shoot-yourself-in-the-foot-in-react-401e7dbba720"}, {"id": 48566824, "rank": 58, "year": 2018, "tags": ["django", "uwsgi"], "title": "uWSGI sometimes stuck and send 502 error", "body": "Hello i am using no config file, just use `systemd` with next command to run uwsgi and very simple config `--socket /var/uwgi/uwsgi.socket --module boost.wsgi_django --chmod-socket=666 -p 64`\n\nAnd sometimes i receive 502 like uwsgi is down but all is ok and no errors even log. It look like server is down for a half of a second and then all is ok again."}, {"id": 48662916, "rank": 59, "year": 2018, "tags": ["java"], "title": "Java Recursive constructor invocation", "body": "public class Person {\n        String name;\n        int weight;\n        int height;\n    \n        public Person(String name, int weight, int height){\n            this.name=name;\n            this.weight=weight;\n            this.height=height;\n        }\n    \n        public Person(String name, int weight){\n            this(name, weight);\n        }\n    }\n\nError:(12, 12) java: recursive constructor invocation\n\nWhat should I change to compile it without errors?\n\nUsing IntelliJ 2017.1"}, {"id": 72129652, "rank": 60, "year": 2022, "tags": ["flutter", "navigation", "flutter-navigation"], "title": "Flutter: Error says - Could not find a generator for route RouteSettings while trying to navigate to another screen", "body": "Although questions with such error messages exist in this site, none solves my problem.\nI have a button and on clicking the button, I just need to go to a different screen. But when ever I tap on the screen, the error shows up.\n\nI first setup a route in `MaterialApp` and then tried to navigate to that route on tapping the button. The full code and the error message are given below:\n\n**Code:**\n\n    import 'livesession1to1.dart';\n    \n    \n    class NavigationService {\n      static GlobalKey<NavigatorState> navigatorKey =\n      GlobalKey<NavigatorState>();\n    }\n    \n    \n    \n    Future<void> main() async {\n      WidgetsFlutterBinding.ensureInitialized();\n    \n      runApp(MaterialApp(\n        home: CountDownTimer(),\n        navigatorKey: NavigationService.navigatorKey, // set property// Added by me later from prev project\n        // initialRoute: \"/\",\n    \n        routes: <String, WidgetBuilder> {\n          '/liveSession1to1': (context) =>LiveSession1to1(),\n        },\n      )\n      );\n    } ome\" property, if non-null, is used.\n 2. Otherwise, the \"routes\" table is used, if it has an entry for the route.\n 3. Otherwise, onGenerateRoute is called. It should return a non-null value for any valid route not handled by \"home\" and \"routes\".\n 4. Finally if all else fails onUnknownRoute is called.\nUnfortunately, onUnknownRoute was not set.\n\n\n***So how to solve the problem ?***"}, {"id": 53494235, "rank": 61, "year": 2018, "tags": ["json", "mongodb", "nosql", "aggregation-framework", "nosql-aggregation"], "title": "Mogodb aggregation create output as {\"key\": \"value\"} from 2 arrays", "body": "I have a question about how to create output from 2 arrays one array with translation key and another with translation i would output as  \n\n\"translation_key\":\"value\" \n \n\n     Current output:       \n     {\n             \n            \"_id\" : ObjectId(\"5bfc0b2b30c4683f585078fb\"),\n            \"translation\" : [ \n                \"hour\", \n                \"day\"\n        \n            ],\n            \"translation_key\" : [ \n                \"HOUR_TEXT\", \n                \"DAY_TEXT\"  \n        \n          \n            ],\n            \"locale_id\" : \"EN_en\"\n       }\n\n\nOUTPUT should be : \n\n\n    {\n        \"EN_en\" :{\n            \"HOUR_TEXT\" :\"hour\",\n            \"DAY_TEXT\" :\"day\",\n        }\n    }"}, {"id": 49655697, "rank": 62, "year": 2018, "tags": ["reactjs", "react-native"], "title": "Array of objects inside Async Storage - React Native", "body": "I am trying to save an array of objects in Async storage that will be rendered as a list. Users will be able to add new items to the array and update and delete each. \n\nAt present, when saving the data, I find my array of objects only ever contains 1 object and each time I add a new one, the previous is overwritten. \n\nPerhaps this is to do with the key used create each item, but I'm not sure how to auto-generate a unique key when working with Async?\n\nSubsequently, when setting async to state, I only have 1 item to loop through when rendering the list.\n\n**List.js**\n\n    constructor(props) {\n        super(props);\n        this.state = {\n          data: []\n        };\n      }\n    \n    onLoad = async () => {\n      try {\n        const data = [];\n        const item = await AsyncStorage.getItem('@foods');\n        const d = JSON.parse(item);\n        const { title } = d;\n        data.push({ title });\n      this.setState({ data });\n    console.log(this.state);\n      } catch (error) {\n        alert('Error', 'There was an error while loading the data');\n      }\n    }\n    \n      render() {\n        return (\n            <View>\n            <FlatList\n              data={this.state.data}\n              renderItem={({ item }) => <Text>{item.title}<\/Text>}\n            />\n            <\/View>\n           );\n         }\n\n**AddItem.js** title (in state) is set from user input\n\n    constructor(props) {\n        super(props);\n        this.state = {\n          title: ''\n        };\n      }\n    \n    saveData = () => {\n      const { title } = this.state;\n    \n      const data = {\n        title\n      };\n    \n      AsyncStorage.setItem('@foods', JSON.stringify(data));\n      alert('save success');\n    }\n\nOutput from console.log below\n\n[![enter image description here][1]][1]\n\n\n  [1]: https://i.stack.imgur.com/DCS0l.png"}, {"id": 55336654, "rank": 63, "year": 2019, "tags": ["azure", "vpn", "vnet"], "title": "Routing traffic from the point to site to vnet to vnet vpn gateway", "body": "We have a point to site VPN gateway, we use it to RD to the VM in a region with the private IP. We have a second VM in a different region. I've created a vnet to vnet vpn. From the first VM I can RD into the second using the private IP. But I was hoping to be able to connect to the second VM just using the point to site VPN. \n\nDo you know if it is possible and what I'm missing?"}, {"id": 72162103, "rank": 64, "year": 2022, "tags": ["reinforcement-learning", "multi-agent"], "title": "Multiagent RL for a single policy in a large-scale network of homogeneous agents", "body": "I am having issue with finding a proper multi-agent RL (MARL) algorithm that scales well for a large number of homogenous agents in an environment. I have an environment,\n\n 1. That is partially observable - agents cannot communication with\n    each other and they don't know about the actions taken by the other\n    agent or the state of the other agents.\n 2. Has a common observation for every agent, i.e., after every time step t -\n    each agent performs an action and everyone receives the same\n    observation from the environment.\n 3. Where agents are required have a policy (same policy for every agent)\n    that can be learned in a centralized way and distributed among\n    agents in a decentralized manner.\n\nI know parameter sharing is a one way to do it, by extending the single agent network (such as DQN or DDQP or SAC) to multiple agents but such mechanism doesn't scale well for a large number of agents especially for the above-mentioned environment. \n\nMADDPG, COMA, MAPPO are some of the choices that use centralized critic but the problem with them again, is that they are not suitable for scaling up because the dimensions of the centralized critic state grow exponentially with the number of agents. \n\n[Mean Field MF-MARL][1] is another choice for scaling up but in MF-MARL, each agent learns its own policy, which is not something I want. \n\nCan someone please suggest me the techniques I can use or if there are any existing algorithms out there that I can use to scale up for 100-500 number of agents, that have a single policy (or maybe 2 policies), that can be deployed at the agents in a decentralized way. \n\n\n  [1]: https://arxiv.org/pdf/1802.05438.pdf"}, {"id": 48504766, "rank": 65, "year": 2018, "tags": ["android", "maven", "android-gradle-plugin", "artifactory"], "title": "How to setup Artifactory
