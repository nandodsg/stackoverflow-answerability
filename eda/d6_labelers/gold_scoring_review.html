 is how I am trying to pass the functions down to this second instance of form\n\n        <DisplayWeather\n            currentweather={this.state.currentweather}\n            currentforecast={this.state.currentforecast}\n            currenttime={this.state.currenttime}\n            weatherIcon={this.state.weatherIcon}\n            hourlyWeather={this.state.hourlyWeather}\n          />\n          <Navbar fetchedweatherdata={this.state.fetchedweatherdata}>\n            <Form\n              onChange={this.handleChange}\n              {...this.state}\n              onSubmit={this.onSubmit}\n            />\n          <\/Navbar>\n\n         and this is how I am trying to call the functions on the form\n          return (\n             <div>\n               {!this.state.fetchedweatherdata ? (\n              <div>\n               <button onClick={this.resetState}>return to form<\/button>\n            <\/div>\n               ) : (\n             <Form onChange={handleChange} {...this.props} onSubmit= . \n              {onSubmit} />\n               )}\n            <\/div>\n\nI am not getting any error messages, the screen refreshes and reloads the origin Form under App, I would like the application to re-send out the api request and show current weather for the new location. Please see gist to see all the code together.\n\nThanks for any help!"}, {"id": 66404888, "rank": 72, "year": 2021, "tags": ["php", "soap"], "title": "Make request form SOAP webservice in PHP", "body": "Make a request in PHP to a SOAP web service can be done with soap php class, I have this example with that web service :http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso?WSDL\n\n  $request_param = array('sCountryISOCode' => 'ES');\n  $responce_param = null;\n  try {\n  $responce_param = $client->CountryCurrency($request_param);\n\n  print_r($responce_param->CountryCurrencyResult->sName);\n  } catch (Exception $e) {\n  echo \"<h2>Exception Error!<\/h2>\";\n  echo $e->getMessage();\n  }\n\nthe SOAP is like that :\n\n  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n  <soap:Envelope xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\">\n  <soap:Body>\n  <CountryCurrency xmlns=\"http://www.oorsprong.org/websamples.countryinfo\">\n  <sCountryISOCode>string<\/sCountryISOCode>\n  <\/CountryCurrency>\n  <\/soap:Body>\n  <\/soap:Envelope>\n\nI want to make request to another webservice which SOAP structure request is like that:\n\n  <soap:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\">\n\n  <soap:Header>\n  <AuthenticationHeader xmlns=\"https://arssenasa.gob.do/\">\n  <Cedula>string<\/Cedula>\n  <Password>string<\/Password>\n  <Proveedo>int<\/Proveedo>\n  <\/AuthenticationHeader>\n  <\/soap:Header>\n\n  <soap:Body>\n  <ConsultarAfiliado xmlns=\"https://arssenasa.gob.do/\">\n  <TipoDocumento>int<\/TipoDocumento>\n  <NumDocumento>string<\/NumDocumento>\n  <\/ConsultarAfiliado>\n  <\/soap:Body>\n  <\/soap:Envelope>\n\nAs we can see the properties of the second structure are found nested into *<soap:Header>* \nWhen I try to pass the data in the array like:\n\n     $request_param = array('Cedula' => 'vvvv', 'Password' => 'vvvvv', 'Proveedo' => 'vvvvv');\n     ------\nI have this error\n**Exception Error!\nSOAP-ERROR: Encoding: object has no 'TipoDocumento' property** \n\nThe webservice provider requires to send those properties into to send back.\nHow can I do that since it's not into the body but the header ?"}, {"id": 59907596, "rank": 73, "year": 2020, "tags": ["javascript", "java", "angular", "spring", "jwt"], "title": "Automatically Updating the records after inserting in jpa Spring Boot", "body": "I have create a jpa entity Order , OrderItems, OrderBatches and OrderBatchStages and created unidirectional OneToMany Relationships between them. The Problem is that when i insert a new record (new order) there is no any error in the insertion the order is inserting in the database but the issue is that the inserted rows are updated automatically. My Entities are..\n**Order**\n```\n\n    @Entity\n@Table(name = \"orders\")\n\npublic class OrderBean\n{\n @Id\n @GeneratedValue(strategy = GenerationType.AUTO)\n @Column(name = \"order_id\")\n\n private Long orderId;\n\n @Column(name = \"order_date\")\n private Date orderDate;\n\n @Column(name = \"total_quantity\")\n private Integer totalQuantity;\n\n @Column(name = \"order_no\")\n private Long orderNo;\n\n @ManyToOne\n private RecipeBean recipeBean;\n\n @ManyToOne\n private UnitBean unitBean;\n\n private Integer active = 1;\n\n private Boolean releaseMaterialStatus = false;\n\n @Transient\n private Integer productId;\n\n @Transient\n private Integer unitId;\n\n @Transient\n private String productName;\n\n @Transient\n private String unitName;\n\n @Enumerated(EnumType.STRING)\n private OrderStatusTypes status;\n\n @Enumerated(EnumType.STRING)\n private OrderStatusStages stage;\n\n @OneToMany(cascade = CascadeType.ALL)\n @JoinColumn(name = \"orders_id\")\n private List<OrderItems> orderItems;\n\n\n private Integer stageId;\n\n\n @OneToMany(cascade = CascadeType.ALL)\n @JoinColumn(name = \"order_orderbatch_id\")\n private Set<OrderBatches> batchesSet  = new HashSet<OrderBatches>();\n\n private boolean productionFinish;\n\n @Enumerated(EnumType.STRING)\n private OrderType type;\n```\n\n\n**OrderBatches**\n```\n@Entity\n@DynamicUpdate(false)\npublic class OrderBatches {\n @Id\n @GeneratedValue(strategy = GenerationType.AUTO)\n private Long batchId;\n\n @Column(name = \"batch_no\")\n private double batchNo;\n\n @Column(name = \"batch_code\")\n private String batchCode;\n\n private Long orderId;\n\n private double quantity;\n\n @Enumerated(EnumType.STRING)\n private BatchStatus status;\n\n @Column(name = \"batch_time\")\n private String batchTime;\n\n @JoinColumn(name = \"batchstageid\")\n @JsonIgnoreProperties({ \"hibernateLazyInitializer\", \"handler\" })\n @OneToMany(fetch = FetchType.LAZY, cascade = CascadeType.ALL)\n\n private List<OrderBatchStages> batchStages;\n```\n\n**OrderBatchStages**\n```\n@Entity\n@DynamicUpdate(false)\npublic class OrderBatchStages\n{\n @Id\n @GeneratedValue(strategy = GenerationType.AUTO)\n private Integer id;\n\n @Column(name = \"stage_number\")\n private int stageNumber;\n\n @Column(name = \"stage_title\")\n private String stageTitle;\n\n @Column(name = \"batch_Id\")\n private Long batchId;\n\n @Enumerated(EnumType.STRING)\n private BatchStageStatus status;\n\n private Boolean qc;\n```\n\n**OrderItems**\n```\n@Entity\n@Table(name = \"order_items\")\npublic class OrderItems\n{\n    @Id\n    @GeneratedValue(strategy = GenerationType.AUTO)\n    private Integer id;\n    private Integer produtId;\n    private Double requiredQuantity;\n    private Integer status;\n    private Double stockQuantity;\n    private Boolean exceed;\n    private String productName;\n```\n[![The update queries are running like this][1]][1]\n\n\n\n  [1]: https://i.stack.imgur.com/qIrHJ.png"}, {"id": 55208667, "rank": 74, "year": 2019, "tags": ["java", "image", "image-processing", "count", "marvin-framework"], "title": "Detecting the number of horizontal and vertical lines in an image to predict any symbol", "body": "I'm trying to get the detect the number of horizontal and vertical lines and based on that, I want to detect the name of the symbol.\n\nI have tried this approach,\nhttps://stackoverflow.com/questions/3932618/java-image-analysis-counting-vertical-lines\nbut the solution is very image specific whereas in my case, the image threshold would change according to the image. \n\n[![enter image description here][1]][1]\n\n\n[![enter image description here][2]][2]\n\nThese are some of the symbols that I have to detect (have a set of more 30 symbols). I have used some other approaches using Marvin, but those are also not giving me proper results.\n\nAny help would be highly appreciated.\nThank you.\n\n\n  [1]: https://i.stack.imgur.com/z8CyL.jpg\n  [2]: https://i.stack.imgur.com/vCvFj.jpg"}, {"id": 66116135, "rank": 75, "year": 2021, "tags": ["botframework", "microsoft-teams", "adaptive-cards"], "title": "Placeholder is not visible in MS teams message extension adaptive card in Android app", "body": "I had built a message extension on Microsoft Teams which opens an Adaptive card. \n\nThe placeholder in the dropdown is not visible in case of Android app, but visible for iOS and desktop app.\n\nPlease refer the screenshot below:\n\n[![enter image description here][1]][1]\n\n\n  [1]: https://i.stack.imgur.com/uAbB3.png"}, {"id": 48584531, "rank": 76, "year": 2018, "tags": ["ios", "swift", "ios-charts"], "title": "iOS Charts with interactive tracking. Is it possible?", "body": "Using iOS Charts (by Daniel Gindi https://github.com/danielgindi/Charts), is it possible to track touching? So when I move my finger on the screen, instead of panning the graph, it would continuously highlight the entry I touched. Something like the image below. \n\nI am thinking to probably add a `UIGestureRecognizer` to the chart view, get the position of the touch, and programmatically highlight the entry. But how can I get the entry at that specific position? Thank you\n\n[![enter image description here][1]][1]\n\n\n  [1]: https://i.stack.imgur.com/cHlQg.png"}, {"id": 69437052, "rank": 77, "year": 2021, "tags": ["reactjs", "autocomplete", "material-ui", "icons"], "title": "How to customize icon on autoselect material-ui", "body": "How can I just change the icon for the open/close dropdown list? \nI want to functionality to stay the same. \nAs I tried to add them as endAdornment, the functionality is gone for both remove and open/close(arrow) icons. \n\nI just want to add a new arrow icon instead of material ui's custom one.\n\n[![enter image description here][1]][1]\n\n\n  [1]: https://i.stack.imgur.com/UfT7b.png\n\n        return (\n        <div>\n            <Autocomplete\n                {...defaultProps}\n                className=\"contract-search\"\n                onChange={(event, value) => {\n                    handleOnChange(event, value);\n                }}\n                id=\"disable-close-on-select\"\n                sx={{ width: 300 }}\n                renderInput={params => {\n                    console.log(params);\n                    return (\n                        <TextField\n                            {...params}\n                            InputProps={{\n                                ...params.InputProps,\n                                startAdornment: (\n                                    <span className=\"contract-search-icon\">\n                                        <img src={`${ASSETS_BASE_URL}/icons/icon-search.svg`} alt=\"\" />\n                                    <\/span>\n                                ),\n                            }}\n                            label=\"Vertrag suchen\"\n                            variant=\"standard\"\n                        />\n                    );\n                }}\n            />\n        <\/div>\n    );"}, {"id": 68759793, "rank": 78, "year": 2021, "tags": ["sql", "postgresql", "function"], "title": "PostgreSQL Function returning JSON takes name of function", "body": "This PostgreSQL function successfully returns JSON; however, the function name is associated with the result:\n```sql\nCREATE OR REPLACE FUNCTION public.find_classes(\n search_text character varying,\n current_page integer DEFAULT 1,\n page_size integer DEFAULT 10,\n sort_by character varying DEFAULT 'name'::character varying,\n direction character varying DEFAULT 'ASC'::character varying\n)\nRETURNS json AS\n$$\n  WITH classes_found AS (\n    SELECT\n      classes._id AS id, classes.name, classes.description, classes.active\n    FROM classes\n    WHERE search_text IS NULL OR search_text = '' OR LOWER(classes.name) LIKE LOWER(search_text) || '%'\n    ORDER BY\n      CASE \n     WHEN direction = 'ASC' THEN\n       CASE\n      WHEN sort_by = 'name' THEN classes.name\n      WHEN sort_by = 'active' THEN classes.active::varchar\n    END\n   END ASC,\n   CASE\n     WHEN direction = 'DESC' THEN\n       CASE\n      WHEN sort_by = 'name' THEN classes.name\n      WHEN sort_by = 'active' THEN classes.active::varchar\n    END\n   END DESC\n  )\n  SELECT json_build_object(\n   'totalItems',(SELECT COUNT(*) FROM classes_found),\n   'currentPage', current_page,\n   'pageSize', page_size,\n   'classes', (SELECT json_agg(l.*) FROM (SELECT classes_found.* FROM classes_found LIMIT page_size OFFSET ((current_page - 1) * page_size)) l )\n ) AS results;\n$$ LANGUAGE SQL;\n```\n\nAs far as both pgAdmin and node-postgres go, the data returned looks like one row with a JSON column named \"find_classes\".\n\n[![enter image description here][1]][1]\n\nIf it has to have a name, I want it to be \"results\" so I can handle it on on the calling side in a more modular way.\n\nIn the SELECT at the bottom, I tried adding \"AS results\" but that didn't help.\n\nAny idea how to change the column name returned?\n\n\n  [1]: https://i.stack.imgur.com/24xnB.png"}, {"id": 73650942, "rank": 79, "year": 2022, "tags": ["python", "api", "xmlhttprequest", "http-headers", "postman"], "title": "RavenPack API_key is working in postman but NOT in python code", "body": "I am tryin to work with this repo https://github.com/RavenPack/python-api \n\nWeirdly enough, the API is working perfectly with POSTMAN (it's a tool used to automate testing API development and HTTP calls)\n\nHere's the code snippet \n\n    from ravenpackapi import RPApi\n    from ravenpackapi import Dataset\n    \n    api = RPApi(\n        api_key=\"_________\" //correct api_key was intentionally removed for the post\n    )\n    \n    ds = api.create_dataset(\n        Dataset(\n            name=\"New Dataset\",\n            filters={\n                \"relevance\": {\n                    \"$gte\": 90\n                }\n            },\n        )\n    )\n    \n    print(\"Dataset created\", ds)\n\nHere is the error message. \n\n[![enter image description here][1]][1]\n\n\n**I repeat the same API key is working with postman on the same device and network.** It's just that their python library is giving me a hard time.\n\n\n    Exception has occurred: APIException\n    Got an error 401: body was '{\"endpoint\":\"datasets\",\"errors\":[{\"type\":\"UnauthorizedError\",\"reason\":\"Unauthorized: Must supply a valid API key\"}]}'\n      File \"C:\\Users\\XYZ\\Documents\\Python\\RavenPackAPI.py\", line 8, in <module>\n        ds = api.create_dataset(\n\n\n  [1]: https://i.stack.imgur.com/zcojN.png"}, {"id": 69925081, "rank": 80, "year": 2021, "tags": ["java", "android", "android-studio", "android-layout", "android-view"], "title": "How to access setOnClickListener of a button in custom view in android?", "body": "I am very new to Android Development and this is my first Android App.\n\nHere is how my MainActivity layout looks like:\n\n[![enter image description here][1]][1]\n\nAnd this is the Component Tree of the MainActivity\n\n[![enter image description here][2]][2]\n\nThe gridView is a custom view and I have a `resetGrid` function in it which looks something like this\n\n```\npublic class GridView extends View {\n\n    resetGird(){\n        // stuff that resets grid;\n    }\n}\n```\n\n\nHere is the problem I am facing:\n\nI can access the `setOnClickListener` of the reset button in the `MainActivity` file but not in the `GridView` file where the `resetGrid` function is located.\n\n```\n        resetButton.setOnClickListener(new View.OnClickListener() {\n            @Override\n            public void onClick(View v) {\n                Toast.makeText(PathFind.this, \"reset\", Toast.LENGTH_SHORT).show();\n            }\n        });\n```\n\nI want to access this `setOnClickListener` of the reset button in the `GridView` file also and call the `resetGrid` function whenever the button is pressed.\n\nNot only that, my plan is to use all the controls listed in the image (start button, diagonal checkbox, speed slider) to control the GridView. But I can't seem to find a way to do that.\nAll the controls are available in the main_activity but I can't use them in the GridView.\n\n\n\n\n  [1]: https://i.stack.imgur.com/OEZlC.png\n  [2]: https://i.stack.imgur.com/QdVGB.png"}, {"id": 55283908, "rank": 81, "year": 2019, "tags": ["android", "bluetooth", "elm", "elm327"], "title": "ELM327 Bluetooth communication issue", "body": "I made an Android app to communicate with an ELM327 OBD-II dongle via bluetooth. \nWhen I test the app with a bluetooth serial terminal (CoolTerm / macOS) the app is **receiving and sending** data without an issue.\n\nUsing my app to transfer commands to the ELM will result in broken and splitted answers. \n\nOutput: \n    \n    DataReceivedHandler: 9V\n    DataReceivedHandler: 9V>\n    DataReceivedHandler: 11.\n    DataReceivedHandler: 9V>\n\n\n[![Screenshot][1]][1]\n   \n\nThe example above should show the result of the `AT RV` command which queries the battery's voltage of the vehicle (I sent the command multiple times). \n\nExpected (good) result should look like this: `>11.9V`\n\nBefore I send the first command to query OBD values the ELM is initialized by these AT-commands: \n\n    AT D\n    AT Z\n    AT E0\n    AT L0\n    AT S0\n    AT H0\n    AT SP 0\n\n\nIf you have any idea how to get clear answers from the ELM, please let me know. \n\nThanks in advance!\n\n  [1]: https://i.stack.imgur.com/RcHAo.jpg"}, {"id": 70514973, "rank": 82, "year": 2021, "tags": ["python-3.x", "multithreading", "selenium"], "title": "Python - Speeding up Web Scraping using multiprocessing", "body": "I have the following function to scrape a webpage.\n\n```\ndef parse(link: str, list_of_samples: str, index: int) -> None:\n    # Some code to scrape the webpage (link is given)\n    # The code will generate a list of strings, say sample\n    list_of_samples[index] = sample\n```\n\nI have another script that calls the above script for all URLs present in a list\n\n```\ndef call_that_guy(URLs: list) -> list:\n    samples = [None for i in range(len(URLs))]\n    for i in range(len(URLs)):\n        parse(URLs[i], samples, i)\n    return samples\n```\nSome other function that calls the above function\n\n```\ndef caller() -> None:\n    URLs = [url_1, url_2, url_3, ..., url_n]\n    # n will not exceed 12\n    samples = call_thay_guy(URLs)\n    print(samples)\n\n# Prints the list of samples, but is taking too much time\n```\n\nOne thing I noticed is that the parse function is taking around 10s to parse a single webpage (I am using Selenium). So, parsing all the URLs present in the list, it is taking around 2 minutes. I want to speed it up, probably using multithreading.\n\nI tried doing the following instead.\n\n```\nimport threading\n\ndef call_that_guy(URLs: list) -> list:\n    threads = [None for i in range(len(URLs))]\n    samples = [None for i in range(len(URLs))]\n    for i in range(len(URLs)):\n        threads[i] = threading.Thread(target = parse, args = (URLs[i], samples, i))\n        threads[i].start()\n    return samples\n```\n\nBut, when I printed the returned value, all of its contents were None.\n\nWhat am I trying to Achieve:\n\nI want to asynchronously Scrape a list of URLs and populate the list of samples. Once the list is populated, I have some other statements to execute (they should execute only after samples is populated, else they'll cause Exceptions). I want to scrape the list of URLs faster (asynchronously is allowed) instead of scraping them one after another.\n\n[![enter image description here][1]][1]\n\n(I can explain something more clearly with image)\n\n\n  [1]: https://i.stack.imgur.com/Yzf0B.png"}, {"id": 64939032, "rank": 83, "year": 2020, "tags": ["nativescript", "code-documentation"], "title": "Where are the definitions for methods in nativescript docs", "body": "This is a (hopefully) rather simple question. In the nativescript documentation, the method definitions always say something like *\"Defined in ui/core/view-base/view-base.d.ts:301\"*, but I have no clue what that's referring to and I need to know what these methods do. Maybe I'm looking in the wrong place or the wrong docs? I'm learning to use nativescript so any help would be great!\n\nThanks\n\nThis is the documentation I'm trying to use: https://docs.nativescript.org/api-reference/\n\n[![][1]][1]\n\n\n  [1]: https://i.stack.imgur.com/KJqbz.jpg"}, {"id": 69966579, "rank": 84, "year": 2021, "tags": ["ios", "xcode", "swiftui", "ios15", "xcode13"], "title": "SwiftUI NavigationBar empty space under the title", "body": "I was working on the xCode 12 and upgraded to 13. Now I'm seeing a weird empty space under the navigation bar title text.\nI have shared some screenshots.\n\n[![Empty Space][1]][1]\n\nHere is the another image that have the scrollview, and the navigation bar is overlapping it.\n\n[![Overlapping Scrollview][2]][2]\n\nIt only happened after upgrading the XCODE to 13 and iOS 15\n\n\n  [1]: https://i.stack.imgur.com/0om1p.png\n  [2]: https://i.stack.imgur.com/zAGoy.png"}, {"id": 64698368, "rank": 85, "year": 2020, "tags": ["http", "url", "mule4"], "title": "http request in mulesoft", "body": "I am trying to pass the below url in http request connector in mulesoft. \n\nGET https://www.googleapis.com/drive/v3/drives?q=name%20contains%20%22QA-zz-SFJobs-Contacts%22&useDomainAdminAccess=true\n\nAuthorization: Bearer [YOUR_ACCESS_TOKEN]\nAccept: application/json\n\nBut am getting error as not found, but the drive is present in google drive how\n\nRefer below image.\n\n[![enter image description here][1]][1]\n\n\nHow can i pass the url in mule 4 http connector\n\n\n  [1]: https://i.stack.imgur.com/3a9Ph.png"}, {"id": 63628718, "rank": 86, "year": 2020, "tags": ["keycloak", "keycloak-services"], "title": "Negative logic for UMA Policy in Keycloak", "body": "I want to manage policies for my resources in Keycloak through a UMA compliant endpoint. So I created a resource `profile` with scopes `view_users, invite_users, edit_users`.\n\nThen I moved on to creating Policies using the Policy API.\n\n```\n## POST\n{\n    \"name\": \"can_view_users\",\n    \"logic\": \"NEGATIVE\",\n    \"decisionStrategy\": \"AFFIRMATIVE\",\n    \"clients\": [\"uma_postman\"],\n    \"scopes\": [\"view_users\"],\n    \"roles\": [\"uma_postman/lg_admin\", \"uma_postman/sales\", \"uma_postman/customer_admin\"],\n    \"users\": [\"37ae8b1e-f1b0-4e72-b6ac-5ad1e49f89d7\", \"3627cb69-23ed-474d-abec-8f31b230b730\"]\n}\n```\nI can query this(`GET http://localhost:8080/auth/realms/ng_whs/authz/protection/uma-policy`) and it seems that the policy is created properly.\n\n[![enter image description here][1]][1]\n\nNow my understanding is that since the decision strategy is AFFIRMATIVE & the logic is NEGATIVE, for any of the above roles - `lg_admin, sales, customer_admin` or the user with the above ids, I should not be allowed access to the resource. \n\nHowever, when I query as a user with the above role or id, I still **don't** get access denied.\n[![enter image description here][2]][2]\n\nNow when I change the logic to POSITIVE for the same policy, the response is still the same. Am I missing something here? Any help would be really appreciated. :) \n\nI was following the instructions from here - [keycloak.org/docs/latest/authorization_services/#_service_authorization_uma_policy_api][3]\n\n\n  [1]: https://i.stack.imgur.com/yFXmr.png\n  [2]: https://i.stack.imgur.com/9drIr.png\n  [3]: https://keycloak.org/docs/latest/authorization_services/#_service_authorization_uma_policy_api"}, {"id": 71390078, "rank": 87, "year": 2022, "tags": ["deep-learning", "nlp", "pytorch"], "title": "Pytorch datasets.UDPOS.splits throwing error", "body": "I want to split the UDPOS dataset into train, valid, and test by fields. Below is my code-\n\n    import torch\n    import torch.nn as nn\n    import torch.optim as optim\n    \n    from torchtext.legacy import data\n    from torchtext import datasets\n    \n    SEED = 1234\n    \n    random.seed(SEED)\n    np.random.seed(SEED)\n    torch.manual_seed(SEED)\n    torch.backends.cudnn.deterministic = True\n    \n    TEXT = data.Field(lower = True)\n    UD_TAGS = data.Field(unk_token = None)\n    PTB_TAGS = data.Field(unk_token = None)\n    \n    fields = ((\"text\", TEXT), (\"udtags\", UD_TAGS), (\"ptbtags\", PTB_TAGS))\n    \n    train_data, valid_data, test_data = datasets.UDPOS.splits(fields)\n\nThis code give me following error-\n[![enter image description here][1]][1]\n\n\n  [1]: https://i.stack.imgur.com/vqJH2.png\n\nI am using Pytorch version - '1.10.2'. \n\nHow do I split the UDPOS dataset using fileds in the current version."}, {"id": 50907776, "rank": 88, "year": 2018, "tags": ["javascript", "d3.js"], "title": "Select the complete bar of stacked bar chart D3", "body": "[![enter image description here][1]][1]    I need to highlight complete bar not one part of bar. \non click of bar, I am trying to highlight the bar but it is not highlighting complete bar as shown in the below image.\n\n   \n\n     .on('click', function(d)\n              {\n                 d3.select(lastClicked).style('filter','');\n              \n        \n               var defs = d3.select('defs');\n               var filter = defs.append(\"filter\")\n                .attr(\"id\", \"drop-shadow\")\n                .attr(\"height\", \"200%\");\n                      \n         d3.select(this).style(\"filter\", \"url(#drop-shadow)\");//To highlight the bar\n               \n               lastClicked = this;\n               if(typeof(eventHandler) == \"function\")\n                eventHandler(d);\n              });\n\n\n  [1]: https://i.stack.imgur.com/xRqoj.png"}, {"id": 73675257, "rank": 89, "year": 2022, "tags": ["css", "scroll", "material-ui"], "title": "Can I give a custom scrollbar style to Autocomplete Listbox Mui?", "body": "I need to give a custom scroll style in Autocomplete Listbox. \n\n[![enter image description here][1]][1]\n\n\n  [1]: https://i.stack.imgur.com/MifSm.png\n\nI tried and research it and none of them worked.\n\nMy last codes\n\n```\n    <Autocomplete\n                fullWidth\n                popupIcon={<KeyboardArrowDownIcon />}\n                id=\"combo-box-demo\"\n                options={allTableData}\n                noOptionsText={\"Məhsul tapılmadı\"}\n                getOptionLabel={(option) => option.name ?? option}\n                ListboxProps={{\n                  style: {\n                    maxHeight: \"200px\",\n                    \"&::-webkit-scrollbar\": {\n                      width: \"20px\",\n                    },\n                  },\n                }}\n```"}, {"id": 73012994, "rank": 90, "year": 2022, "tags": ["javascript", "html"], "title": "Get data from a table html with click", "body": "Good afternoon, I'm a beginner, I'm having trouble getting information from a table that consumes data from an api.\n\n        index.html\n    <!DOCTYPE html>\n    <html lang=\"en\">\n    <head>\n        <meta charset=\"UTF-8\">\n        <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n        <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n        <link rel=\"stylesheet\" href=\"style.css\">\n        <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css\">\n        \n        <script src=\"main.js\"><\/script>\n        <title>Document<\/title>\n    <\/head>\n    <body onload=\"apendeOnClick()\">\n        <table id=\"tablerow\">\n            <caption>Alien football stars<\/caption>\n            <thead>\n                <tr>\n                    <th>DATA<\/th>\n                    <th>TELEFONE<\/th>\n                    <th>RAMAL<\/th>\n                    <th>DESCRIÇÃO<\/th>\n                    <th>ACÕES<\/th>\n                <\/tr>\n            <\/thead>\n            <tbody id=\"table_body\">\n                       \n            <\/tbody>\n        <\/table>\n    \n        <script>\n            \n        <\/script>\n    <\/body>\n    <\/html>\n\nMy code is this, it feeds the table normally, but I would like when the person clicks on the row button to display the information in the alert.\n\n    main.js\n    fetch(\"https://my-json-server.typicode.com/lfnoleto/api-fake/contact\").then((data) => {\n        return data.json()\n    }).then((Objectdata) => {\n        //console.log(Objectdata[0].data)\n        let tabelaData = \"\"\n      \n    \n        Objectdata.map((values)=>{\n           \n            tabelaData += `<tr>\n                <td>${values.data}<\/td>\n                <td>${values.tefone}<\/td>\n                <td>${values.ramal}<\/td>\n                <td>${values.descricao}<\/td>\n                <td><button id=\"butao\" class=\"btn btn-success\" ><i class=\"fa fa-phone\"><\/button><\/td>\n            <\/tr>`\n            \n        })\n    \n        document.getElementById(\"table_body\").innerHTML = tabelaData\n        innerHTML = tabelaData\n    \n        \n    })\n    \n    function apendeOnClick(){\n    \n        const table = document.getElementById(\"tablerow\")\n        console.log(table)\n        if (table) {\n            for (var i = 0; i < table.rows.length; i++) {\n              table.rows[i].childNodes[5].childNodes[1].onclick = function() {\n                tableText(this);\n              };\n            }\n        }\n    }\n    \n    function tableText(tableRow) {\n        let telefone = tableRow.childNodes[1].innerHTML;\n        let ramal = tableRow.childNodes[2].innerHTML;\n        let obj = {'telefone': telefone, 'ramal': ramal};\n        console.log(obj);\n      }\n\n\nI hope that when the person clicks on the telephone icon, he displays the extension and telephone information\n\n[![enter image description here][1]][1]\n\n\n  [1]: https://i.stack.imgur.com/6FVhn.png"}, {"id": 64044429, "rank": 91, "year": 2020, "tags": ["javascript", "reactjs", "asynchronous", "redux", "request"], "title": "Are this series of request executed in parallel?", "body": "I am using redux to dispatch a series of requests. My intention is to write the actions logic so that **the series will be executed in parallel** (the volume of requested data is not huge, but considerable).\n\nHowever, looking at redux devtools inspector pane, it does seem like the request are executed as a perfect queue – first come, first served:\n\n[![enter image description here][1]][1]\n\n\n  [1]: https://i.stack.imgur.com/1JDQG.png\n\nWhich raises suspicion That these request are, in reality, serial.\n\nI've tested this only in local enviroment, however the results are the same even if throttling via devtools to \"slow 3\"G.\n\nHere's related redux code:\n\n    const yearsSince2013 = Array.from(\n      { length: new Date().getFullYear() - 2013 + 1 },\n      (_, i) => i + 2013,\n    )\n       \n    export const fetchProjectsOfOneYear = year => async dispatch => {\n      try {\n        dispatch(fetchProjectsOfOneYearInit(year))\n        const response = await client.get(`projects/${year}`)\n        dispatch(fetchProjectsOfOneYearSuccess(response.data, year))\n      } catch (error) {\n        dispatch(fetchProjectsOfOneYearFailure(year, error))\n      }\n    }\n    \n    export const fetchAllProjects = () => async dispatch => {\n      try {\n        dispatch(fetchAllProjectsInit())\n        // Is the line below resulting in parallel or serial execution?\n        Promise.all(yearsSince2013.map(async year => dispatch(fetchProjectsOfOneYear(year)))).then(_ =>\n          dispatch(fetchAllProjectsSuccess()),\n        )\n      } catch (error) {\n        dispatch(fetchAllProjectsFailure(error))\n      }\n    }"}, {"id": 73623911, "rank": 92, "year": 2022, "tags": ["c++", "qt", "drag-and-drop", "qt5", "mime-types"], "title": "How to obtain the full path of a file (or multiple files) after drag/drop it from a folder to a QListWidget", "body": "I have a small problem: **How do I obtain the full path of a file (or multiple files) after I drag/drop it on a `QListWidget`?**\n\nI prepared a *small verifiable example* where I implemented the drag and drop function. The `ui` is composed only by 1 `QListWidget` and a `QTableView` (not used yet).\n\nBelow the **wrong result** after I drag and drop 2 files from a `/home` folder\n\n[![enter image description here][1]][1]\n\n\n\nBelow the **desired result** I am looking for after I drag and drop the files from a folder:\n\n[![enter image description here][2]][2]\n\n\nYes, you already guessed it right. The reason is that I would want the user to be able to visualize all the time where those files came from after dragging/dropping from different folders.\n\nBelow the Minimal verifiable example. You can copy/past on your machine and it will work no problem:\n\n**main.cpp**\n\n    #include \"mainwindow.h\"\n    #include <QApplication>\n    \n    int main(int argc, char *argv[])\n    {\n        QApplication a(argc, argv);\n        MainWindow w;\n        w.show();\n        return a.exec();\n    }\n\n**mainwindow.h**\n\n    #define MAINWINDOW_H\n    #include <QMainWindow>\n    \n    QT_BEGIN_NAMESPACE\n    namespace Ui { class MainWindow; }\n    QT_END_NAMESPACE\n    \n    class MainWindow : public QMainWindow\n    {\n        Q_OBJECT\n    \n    public:\n        MainWindow(QWidget *parent = nullptr);\n        ~MainWindow();\n    \n    protected:\n        void dragEnterEvent(QDragEnterEvent *event);\n        void dragLeaveEvent(QDragLeaveEvent *event);\n        void dragMoveEvent(QDragMoveEvent *event);\n        void dropEvent(QDropEvent *event);\n    \n    private:\n        Ui::MainWindow *ui;\n    };\n    #endif // MAINWINDOW_H\n\n**mainwindow.cpp**\n\n    #include \"mainwindow.h\"\n    #include \"ui_mainwindow.h\"\n    \n    #include <QDragEnterEvent>\n    #include <QDragLeaveEvent>\n    #include <QDragMoveEvent>\n    #include <QDropEvent>\n    #include <QMimeData>\n    \n    MainWindow::MainWindow(QWidget *parent)\n        : QMainWindow(parent)\n        , ui(new Ui::MainWindow)\n    {\n        ui->setupUi(this);\n        setAcceptDrops(true);\n    }\n    \n    MainWindow::~MainWindow()\n    {\n        delete ui;\n    }\n    \n    void MainWindow::dragEnterEvent(QDragEnterEvent *event)\n    {\n        event->accept();\n    }\n    void MainWindow::dragLeaveEvent(QDragLeaveEvent *event)\n    {\n        event->accept();\n    }\n    void MainWindow::dragMoveEvent(QDragMoveEvent *event)\n    {\n        event->accept();\n    }\n    void MainWindow::dropEvent(QDropEvent *event)\n    {\n        QString name;\n        QList<QUrl> urls;\n        QList<QUrl>::Iterator i;\n        urls = event->mimeData()->urls();\n        for(i = urls.begin(); i != urls.end(); ++i) {\n            name = i->fileName();\n            ui->listWidget->addItem(name);\n        }\n    }\n\n**Below is what I have done so far:**\n\nIn an attempt to try to solve it by myself I consulted [this source](https://contingencycoder.wordpress.com/2013/06/05/load-text-from-file-on-drop-in-qt/) but it mainly describe how to promote the widget, which is not my case. Also I read [this one](https://stackoverflow.com/questions/69980141/how-to-drag-and-drop-files-into-qlistwidget-created-from-qt-designer) which seems to be good but still does not work. Finally I studied [this](https://www.walletfox.com/course/dragdroplistscene.php) but is not exactly what I am looking for as it deals with `QGraphicsView`.\n\nFinally I tried to implement the `dropEvent(QDropEvent *event)` a little bit differently as explained below, it is close but still does not work as I expect because *the drop event will leave the files in the same row but this is wrong. Close, but wrong*:\n\n    void MainWindow::dropEvent(QDropEvent *event)\n    {\n        const QMimeData *mimeData = event->mimeData();\n        QList<QUrl> urlList = mimeData->urls();\n        QString text;\n    \n        for (int i = 0; i < urlList.size(); ++i)\n            text += urlList.at(i).path() + QLatin1Char('\\n');\n        ui->listWidget->addItem(text);\n    }\n\nAs you can see this is also wrong because as soon as I drag/drop multiple files, they are seen as one single row in the `QListWidget` as highlighted in the row:\n\n[![enter image description here][3]][3]\n\n\nThanks for any pointers to the solution.\n\n\n  [1]: https://i.stack.imgur.com/CrWyY.png\n  [2]: https://i.stack.imgur.com/3LwOI.png\n  [3]: https://i.stack.imgur.com/pPwS0.png"}, {"id": 71675281, "rank": 93, "year": 2022, "tags": ["attributes", "gis", "netlogo", "centroid"], "title": "GIS Vector use in Netlogo and patches compatibility", "body": "Using the `gis extension` in Netlogo I aim to upload a large vector into NETLOGO. \n\nBetween the `apply-coverage`command and the following lines of codes, I picked the following because they are faster and lead to the same results (I checked using `export-world` command. \nThe following lines of codes are inspired from this source <http://geospatialcss.blogspot.com/2015/10/tutorial-on-using-and-exporting-gis.html> and the book \"Agent-based modelling and GIS\" from Brooks (2019).\n\nThe idea is to apply the attributes of each polygonsto the centroid of each patches in order to be used. \n\n\n` ;; assign each patch to one parcel\n  let n 1\n  foreach gis:feature-list-of Parcels_2015 [\n    polygone ->\n    let center-point gis:location-of gis:centroid-of polygone\n    let x-coordinate item 0 center-point\n    let y-coordinate item 1 center-point\n\n    ask patch x-coordinate y-coordinate [\n     \n      ;; set an ID to the patch\n      set ID_temp n\n      set ID_Parcel gis:property-value polygone \"ID_PRCL\"\n      ;; and others....    \n      ;; we set the variables of each patch\n      set LU gis:property-value polygone \"LUCTGRY\"\n      ;; and other variable....\n      \n      ;;and color the map depending on the LUCTGRY\n      if gis:property-value polygone \"LUCTGRY\" = \"Extensive grassland\"  [\n      set pcolor green\n      ]\n      set n n + 1\n    ]\n  ]\n\n**I have however realised that the patches remain \"square\" and do not represent the \"real world\".** Is it possible to have patch fitting to the parcels of the map here-below (black lines) ?\n\n[![enter image description here][1]][1] \n\n\n  [1]: https://i.stack.imgur.com/Igxk0.png"}, {"id": 53406755, "rank": 94, "year": 2018, "tags": ["swift", "uinavigationbar"], "title": "How to set two colors in navigation bar?", "body": "Is there any way to split navigation bar into two parts or need to add any custom view, to add two colors in navigation bar like below-\n\n[![enter image description here][1]][1]\n\n\n  [1]: https://i.stack.imgur.com/UCUn9.png"}, {"id": 56504817, "rank": 95, "year": 2019, "tags": ["spring-mvc", "tomcat"], "title": "Tomcat 9 Spring App Using WebApplicationInitializer Context Path Not Working", "body": "I have a Spring 4.3.6 App that I'm migrating from a Tomcat 8.5 server, to a Tomcat 9.0.20 server on a different Linux host.\n\nAll works fine on the TC 8.5 server.\n\nThe docBase contains static html, and a war file. The war does unpack during startup, and the log shows \"Initializing Spring FrameworkServlet 'dispatcher'\". I can browse to the static content, but when browsing to the web app test page I get a 404 - see URLS:\n\n[Static Content][1]\n\n[Web App Test Page][2]\n    \nHere's my Host element:\n\n        <Host name=\"tanglemydata.dev\" appBase=\"/home/carpenterdev/public_html/tanglemydata.dev\" unpackWARs=\"true\" autoDeploy=\"true\"\n              xmlValidation=\"false\" xmlNamespaceAware=\"false\">\n           <Context path=\"\" reloadable=\"true\" docBase=\"/home/carpenterdev/public_html/tanglemydata.dev\" /> \n        <\/Host>\n\n[![Screen Shot of docBase][3]][3]\n\nThanks for helping!\n\nBob\n  [1]: https://tanglemydata.dev/\n  [2]: https://tanglemydata.dev/tanglemydataapp/login_cont/login_testpage\n  [3]: https://i.stack.imgur.com/h8y41.jpg"}, {"id": 69483166, "rank": 96, "year": 2021, "tags": ["c++", "qt", "qmdiarea"], "title": "Problems with QMdiSubWindows: Window Flags vanishes after maximizing and SubWindow can be get lost by moving it", "body": "I have two problems with my QMdiSubWindows. \nAt the moment it is possible to move the subWindow for example below the menu/tool bar of the mainWindow, there it will be lost since I can not reach the window flags of the subwindow anymore. Another problem is that the window flags vanishes after I maximize the subWindow. \n\n[![enter image description here][1]][1]\n\n\nAt the moment my code looks like the following:\n\n\n    //mainwindow.h\n    class MainWindow : public QMainWindow\n    {\n       Q_OBJECT\n\n       public:\n           explicit MainWindow(QWidget * parent = nullptr);\n\n       protected:\n           void\n           closeEvent(QCloseEvent * event);\n\n       private slots:\n           void\n           newSignalTable();\n\n           private:\n           void\n           createMenuBar();\n\n           QMdiArea * m_mdiArea;\n    };\n\n\n\n    //mainwindow.cpp\n    MainWindow::MainWindow(QWidget * parent) : QMainWindow(parent), m_mdiArea(new QMdiArea)\n    {\n        m_mdiArea->setHorizontalScrollBarPolicy(Qt::ScrollBarAsNeeded);\n        m_mdiArea->setVerticalScrollBarPolicy(Qt::ScrollBarAsNeeded);\n        setCentralWidget(m_mdiArea);\n\n        createMenuBar();\n    \n        setWindowTitle(tr(\"%1 (Multiple Models)[    *]\").arg(QApplication::applicationName()));\n    }\n\n\n    void\n    MainWindow::newSignalTable()\n    {\n        QMdiSubWindow * tableSubWindow = new QMdiSubWindow;\n        auto *          tableWidget    = new TableWidget(m_driveComLibrary);\n        QWidget *       newWidget      = tableWidget->createTable();\n        tableSubWindow->setWidget(newWidget);\n        tableSubWindow->setAttribute(Qt::WA_DeleteOnClose);\n        tableSubWindow->setMinimumSize(QSize(320, 300));\n    \n        tableSubWindow->setSizePolicy(QSizePolicy::Fixed, QSizePolicy::Fixed);\n        m_mdiArea->addSubWindow(tableSubWindow);\n        tableSubWindow->show();\n    }\n\n    void\n    MainWindow::createMenuBar()\n    {\n        QAction * newTableAction = new QAction(tr(\"&New Signal Table\"), this);\n        newTableAction->setShortcuts(QKeySequence::New);\n        newTableAction->setStatusTip(\"Create a new signal table\");\n        connect(newTableAction, &QAction::triggered, this, &MainWindow::newSignalTable);\n\n        auto fileMenu = menuBar()->addMenu(tr(\"&File\"));\n        fileMenu->addAction(newTableAction);\n        fileMenu->addSeparator();\n    }\n\n\nDoes anybody know how to restrict the area for the subwindows and how to get the correct representation of the window flags after maximizing the subwindow?\n   \n  [1]: https://i.stack.imgur.com/X4Q5g.png"}, {"id": 59947919, "rank": 97, "year": 2020, "tags": ["javascript", "vue.js", "components", "copy-paste", "codepen"], "title": "How can one use Vue.js code from Codepen?", "body": "I want to use [this][1] code from Codepen. So, I right clicked on the `result` frame and chose `View Frame source`. Then I copied the source code and pasted it in my own text-editor.\n\nBut my webpage shows the codepart as blank. \n\n[![enter image description here][2]][2]\n\nI copied the source starting from `<style>` till `<\/body>` and inserted in my component.\nWhen using the ZIP instead, I don't know how to use the code, because I just have a component and the ZIP contains a script.js and a style.css\n\nWhat am I doing wrong?\n\n\n  [1]: https://codepen.io/dawgrex/details/mdyQgOw\n  [2]: https://i.stack.imgur.com/XpQ06.png"}, {"id": 57437460, "rank": 98, "year": 2019, "tags": ["orbeon"], "title": "Remove Unavailable Items from Form Runner", "body": "I have run into a bit of trouble when using orbeon-2018.2.3.201905172253-PE.\n\nI created some test forms to trial out of the functionality. I have removed them from the builder but cannot work out how to remove them from the form run <script>
const D = JSON.parse(document.getElementById('data').textContent);
const R = D.review;  // null on the blind page
const STORE = `gold${R ? '-review' : ''}:${D.set}:${D.rubric_version}`;
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { state = {}; }
let cur = 0, activeLabel = 0;

function persist() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
function entry(q) { return state[q.id] || (state[q.id] = {}); }
function isDone(q) { const e = state[q.id]; return !!e && D.labels.every(l => e[l.key]) && (!R || !!e.confirmed); }
function isPart(q) { const e = state[q.id]; return !!e && (R ? D.labels.some(l => isSplit(q, l) && e[l.key]) : D.labels.some(l => e[l.key])); }
function votes(q, l) { return R.q[String(q.id)][l.key]; }            // [[level, reason], [level, reason]]
function isSplit(q, l) { const v = votes(q, l); return v[0][0] !== v[1][0]; }
function hasTie(q) { return !!R && D.labels.some(l => isSplit(q, l)); }

// Review: a level both models chose is filled in (the hand labeler can change it); a split waits for a pick.
if (R) D.questions.forEach(q => D.labels.forEach(l => {
  const e = entry(q);
  if (!e[l.key] && !isSplit(q, l)) e[l.key] = votes(q, l)[0][0];
}));

// Tags typed into the body as raw HTML (an <img> or a component in pasted JSX) are shown as text, as a model reads
// them; only simple formatting tags render. So only Markdown images become [image] placeholders below.
const RAW_OK = new Set(['br', 'b', 'i', 'em', 'strong', 'kbd', 'sup', 'sub', 'code', 'pre', 'p', 'hr', 's', 'del',
  'strike', 'ul', 'ol', 'li', 'blockquote', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'a', 'table', 'thead', 'tbody', 'tr',
  'td', 'th', 'div', 'span']);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
marked.use({ renderer: { html(arg) {
  const t = typeof arg === 'string' ? arg : (arg && (arg.text || arg.raw)) || '';
  return t.replace(/<\/?([A-Za-z][\w.:-]*)\b[^>]*>/g,
                   (m, name) => RAW_OK.has(name.toLowerCase()) ? m : `<span class="rawtag">${esc(m)}</span>`);
} } });

// Markdown -> HTML; every image becomes a placeholder (the rubric judges from text, images are never loaded).
function render(md) {
  let html = marked.parse(md || '', { gfm: true, breaks: false });
  html = html.replace(/<img\b[^>]*>/gi, tag => {
    const alt = (tag.match(/\balt="([^"]*)"/i) || [, ''])[1];
    return `<span class="img-ph">[image${alt && alt !== 'enter image description here' ? ': ' + alt : ''}]</span>`;
  });
  return DOMPurify.sanitize(html, { FORBID_TAGS: ['img', 'style', 'iframe', 'form', 'input', 'video', 'audio', 'object', 'embed'],
                                   FORBID_ATTR: ['style'] });
}

function show() {
  const q = D.questions[cur];
  document.getElementById('meta').textContent = `Question ${cur + 1} of ${D.questions.length} · ${q.year} · id ${q.id}`;
  document.getElementById('title').textContent = q.title;
  const tags = document.getElementById('tags'); tags.innerHTML = '';
  q.tags.forEach(t => { const s = document.createElement('span'); s.className = 'tag'; s.textContent = t; tags.appendChild(s); });
  document.getElementById('body').innerHTML = render(q.body);
  document.querySelectorAll('#body a').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
  document.getElementById('note').value = (state[q.id] || {}).note || '';
  activeLabel = R ? Math.max(0, D.labels.findIndex(l => isSplit(q, l))) : 0;
  drawLabels(); drawDots(); window.scrollTo(0, 0);
}

function whyLine(who, level, reason) {
  const d = document.createElement('div');
  const b = document.createElement('b'); b.textContent = `${who} → ${level.replace(/_/g, ' ')}: `;
  d.append(b, document.createTextNode(reason || '(no reason)'));
  return d;
}

// "why" / "rule" sections stay open across redraws (picking a level redraws the panel) until closed by hand.
const opened = new Set();
function keepOpen(id, title) {
  const d = document.createElement('details'); d.innerHTML = `<summary>${title}</summary>`; d.open = opened.has(id);
  d.addEventListener('toggle', () => { d.open ? opened.add(id) : opened.delete(id); });
  return d;
}

function drawLabels() {
  const q = D.questions[cur], e = state[q.id] || {};
  const panel = document.getElementById('labelPanel'); panel.innerHTML = '';
  D.labels.forEach((l, i) => {
    const split = R && isSplit(q, l);
    const box = document.createElement('div');
    box.className = 'label' + (i === activeLabel ? ' active' : '') + (R ? (split ? ' split' : ' agree') : '');
    // A click inside "why" / "rule" only opens it: redrawing the panel would close it again.
    box.onclick = ev => { if (ev.target.closest('details')) return; activeLabel = i; drawLabels(); };
    const name = document.createElement('div'); name.className = 'name'; name.textContent = `${i + 1}. ${l.title}`;
    if (R) {
      const st = document.createElement('span'); st.className = 'state';
      st.textContent = split ? (e[l.key] ? 'tie broken' : 'tie-break') : (e[l.key] === votes(q, l)[0][0] ? 'both agree' : 'changed');
      name.appendChild(st);
    }
    const levels = document.createElement('div'); levels.className = 'levels';
    l.levels.forEach((lv, j) => {
      const b = document.createElement('button'); b.textContent = `${j + 1} ${lv.replace(/_/g, ' ')}`;
      if (R) votes(q, l).forEach(([v], k) => {
        if (v === lv) { const m = document.createElement('span'); m.className = 'mk'; m.textContent = R.models[k].short; b.appendChild(m); }
      });
      if (e[l.key] === lv) b.className = 'on';
      b.onclick = ev => { ev.stopPropagation(); pick(i, j); };
      levels.appendChild(b);
    });
    box.append(name, levels);
    if (R) {
      const why = document.createElement('div'); why.className = 'why';
      votes(q, l).forEach(([v, r], k) => why.appendChild(whyLine(R.models[k].short, v, r)));
      if (split) box.appendChild(why);
      else { const d = keepOpen(`${l.key}:why`, 'why'); d.appendChild(why); box.appendChild(d); }
    }
    const det = keepOpen(`${l.key}:rule`, 'rule');
    const rule = document.createElement('div'); rule.className = 'rule'; rule.innerHTML = render(l.section);
    det.appendChild(rule);
    box.append(det); panel.appendChild(box);
  });
  const done = D.questions.filter(isDone).length;
  let text = `${done} / ${D.questions.length} ${R ? 'confirmed' : 'complete'}`;
  if (R) {
    const open = D.questions.reduce((n, x) => n + D.labels.filter(l => isSplit(x, l) && !(state[x.id] || {})[l.key]).length, 0);
    text += ` · ${open} tie-break${open === 1 ? '' : 's'} left`;
  }
  document.getElementById('progress').textContent = text;
}

function drawDots() {
  const dots = document.getElementById('dots'); dots.innerHTML = '';
  D.questions.forEach((q, i) => {
    const s = document.createElement('span');
    s.className = (isDone(q) ? 'done' : isPart(q) ? 'part' : '') + (hasTie(q) ? ' tie' : '') + (i === cur ? ' cur' : '');
    s.title = `Question ${i + 1}${hasTie(q) ? ' (has a tie-break)' : ''}`; s.onclick = () => { cur = i; show(); };
    dots.appendChild(s);
  });
}

function pick(i, j) {
  const q = D.questions[cur], l = D.labels[i];
  if (j >= l.levels.length) return;
  const e = entry(q); e[l.key] = l.levels[j]; e.at = new Date().toISOString();
  persist();
  if (R) {  // next open tie-break on this question, else stay
    const nxt = D.labels.findIndex((x, k) => k > i && isSplit(q, x) && !e[x.key]);
    activeLabel = nxt >= 0 ? nxt : i;
  } else activeLabel = Math.min(i + 1, D.labels.length - 1);
  drawLabels(); drawDots();
}

function confirmQuestion() {
  const q = D.questions[cur], e = entry(q);
  const missing = D.labels.findIndex(l => !e[l.key]);
  if (missing >= 0) { activeLabel = missing; drawLabels(); return; }  // highlights the label still to pick
  e.confirmed = true; e.at = new Date().toISOString(); persist();
  for (let k = 1; k <= D.questions.length; k++) {
    const i = (cur + k) % D.questions.length;
    if (!isDone(D.questions[i])) { cur = i; show(); return; }
  }
  drawLabels(); drawDots();
}

function go(step) { cur = Math.max(0, Math.min(D.questions.length - 1, cur + step)); show(); }

document.getElementById('note').addEventListener('input', ev => {
  const e = entry(D.questions[cur]); e.note = ev.target.value; persist();
});
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('nextOpen').onclick = () => {
  for (let k = 1; k <= D.questions.length; k++) {
    const i = (cur + k) % D.questions.length;
    if (!isDone(D.questions[i])) { cur = i; show(); return; }
  }
};
document.getElementById('toggleRubric').onclick = () => document.getElementById('rubric').classList.toggle('open');
document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'TEXTAREA' || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (/^[1-9]$/.test(ev.key)) { pick(activeLabel, Number(ev.key) - 1); ev.preventDefault(); }
  else if (ev.key === 'ArrowDown') { activeLabel = Math.min(activeLabel + 1, D.labels.length - 1); drawLabels(); ev.preventDefault(); }
  else if (ev.key === 'ArrowUp') { activeLabel = Math.max(activeLabel - 1, 0); drawLabels(); ev.preventDefault(); }
  else if (ev.key === 'ArrowRight') { go(1); ev.preventDefault(); }
  else if (ev.key === 'ArrowLeft') { go(-1); ev.preventDefault(); }
  else if (ev.key === 'Enter' && R) { confirmQuestion(); ev.preventDefault(); }
  else if (ev.key === 'Escape') { document.getElementById('rubric').classList.remove('open'); }
});

// How the final level relates to the two models' levels (review only).
function decision(q, l, final) {
  const [[a], [b]] = votes(q, l);
  if (!final) return '';
  if (a === b) return final === a ? 'agreed' : 'overrode';
  return final === a ? `picked_${R.models[0].short}` : final === b ? `picked_${R.models[1].short}` : 'other';
}

function csv() {
  const cell = v => { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const head = ['question_id', 'gold_set', 'gold_rank', 'labeler', 'rubric_version', ...D.labels.map(l => l.key),
                ...(R ? D.labels.map(l => `${l.key}__decision`) : []), 'note', 'labeled_at_utc'];
  const rows = D.questions.map(q => {
    const e = state[q.id] || {}, ok = !R || !!e.confirmed;  // an unconfirmed review row is saved empty
    return [q.id, D.set, q.rank, R ? 'human_review' : 'human', D.rubric_version,
            ...D.labels.map(l => ok ? e[l.key] || '' : ''),
            ...(R ? D.labels.map(l => ok ? decision(q, l, e[l.key]) : '') : []), e.note || '', ok ? e.at || '' : ''];
  });
  return [head, ...rows].map(r => r.map(cell).join(',')).join('\n') + '\n';
}
document.getElementById('confirm').onclick = confirmQuestion;
if (R) { document.getElementById('confirm').hidden = false; document.getElementById('reviewKeys').hidden = false; }
document.getElementById('save').onclick = async () => {
  const name = `gold_labels_${D.set}${R ? '_reviewed' : ''}.csv`, text = csv();
  if (window.showSaveFilePicker) {
    try {
      const h = await showSaveFilePicker({ suggestedName: name, types: [{ description: 'CSV', accept: { 'text/csv': ['.csv'] } }] });
      const w = await h.createWritable(); await w.write(text); await w.close(); return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = name; a.click();
};

document.getElementById('setname').textContent = `${D.set} set${R ? ` · review of ${R.models.map(m => m.short).join(' + ')}` : ''}`;
persist();
document.getElementById('version').textContent = D.rubric_version;
document.getElementById('rubric').innerHTML = render(D.rubric_text);
show();
</script>
</body>
</html>
