# Deploys presentation/ to GitHub Pages. Free Pages needs a public repository, so the job is skipped while the repo is
# private (it starts working on its own once the repo goes public). The BigQuery export script and the checks are not
# published: only the page and its data files are copied into the site folder, plus the gold-label review page of
# eda/d6_labelers/ (D6), so it opens as a page rather than as HTML source. Before that, the page's headline numbers are
# checked against their sources (AC-0.11); the test counts come from dbt's manifest, so the job runs `dbt parse` with
# the same dummy profile as CI: no credentials, no warehouse.
name: Deploy presentation

on:
  push:
    branches: [main]
    paths: ["presentation/**", "eda/d6_labelers/gold_scoring_review.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GCP_PROJECT: ci-no-warehouse
      DBT_PROFILES_DIR: ${{ github.workspace }}/.ci-profiles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Dummy dbt profile (no credentials)
        run: |
          mkdir .ci-profiles
          cp profiles.example.yml .ci-profiles/profiles.yml
      - run: dbt deps
      - run: dbt parse
      - run: python presentation/check_data.py
      - name: Headline numbers equal their sources (AC-0.11)
        run: python presentation/check_numbers.py
      - name: Assemble the site folder
        run: |
          mkdir _site
          cp presentation/index.html presentation/style.css presentation/app.js presentation/sql-panel.js _site/
          cp -r presentation/data _site/data
          cp -r presentation/img _site/img
          mkdir _site/eda
          cp eda/d6_labelers/gold_scoring_review.html _site/eda/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
