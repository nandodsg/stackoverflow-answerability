version: 2

data_tests:
  - name: assert_accepted_answer_belongs_to_question
    description: AC-0.3. Warns on the 292 known legacy exceptions (2008–2012); fails if there are more.
  - name: assert_answer_count_matches_joined_answers
    description: AC-0.4. `answer_count` equals the answers present in `posts_answers`, for every question.
  - name: assert_snapshot_unchanged
    description: >
      Stands in for source freshness on a frozen snapshot: warns if the row count or the newest creation time of
      questions or answers differs from the 2022-09-25 snapshot the README numbers come from.
  - name: assert_text_feature_rules
    description: >
      AC-3.4 support. Hand-written Markdown and HTML examples for every text-feature rule in macros/text_features.sql;
      returns the examples where a rule gives a different value. Reads no table.
  - name: assert_wilson_reference_values
    description: AC-1.5. The Wilson bounds match the reference values of specs/001 (9/10, 850/1000, 1/1, 0/1).
  - name: assert_p1_rank_order
    description: AC-1.6. "Highest" ranks sort by the lower bound and "lowest" ranks by the upper bound, in both P1 marts.
  - name: assert_p1_original_tags_stable
    description: >
      AC-0.10 / AC-1.9 (severity: warn, needs_full_scan). 2022 accepted-rate rankings of tags and pairs on current vs
      original tags: lists every group entering or leaving a top / bottom 10 or moving more than 2.5 points.
  - name: assert_p2_original_tags_stable
    description: >
      AC-0.10 / AC-2.6 (severity: warn, needs_full_scan). P2 on current vs original tags, per (tag, year): lists
      populations that are empty in one version, YoY directions that switch, and values that move by more than the
      half-width of the current 95% interval.
