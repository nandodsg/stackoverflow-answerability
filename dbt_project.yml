name: so_answerability
version: "1.0.0"
config-version: 2

# Connection settings live in a profile named like this one: see profiles.example.yml.
profile: so_answerability

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

clean-targets: ["target", "dbt_packages"]

# Folder defaults live here; a model that differs says so in an inline config(). Every model's first line is a
# comment naming its materialization and where it is set (this file or the inline config()).
models:
  so_answerability:
    +materialized: table
    staging:
      # Views store nothing; the BigQuery sandbox has 10 GB of storage.
      +materialized: view
    semantic:
      # Inputs of the MetricFlow layer: views over the intermediate tables, nothing stored.
      +materialized: view
