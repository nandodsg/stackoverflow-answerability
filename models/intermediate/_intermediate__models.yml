version: 2

models:
  - name: int_questions
    description: >
      One row per question with the fields every prompt shares. Partitioned by creation_year. Outcome definitions
      follow specs/000: answered = at least one answer; accepted = `accepted_answer_id` is not null.
    columns:
      - name: question_id
        data_tests: [unique, not_null]
      - name: creation_year
        data_tests: [not_null]
      - name: tag_count
        description: Number of current tags (1–5; 119 legacy questions have 6).
      - name: answer_count
        description: The answer count used by every metric.
      - name: n_answers_joined
        description: Answers found in `posts_answers` for this question; must equal `answer_count` (AC-0.4).
      - name: is_answered
        data_tests: [not_null]
      - name: has_accepted_answer
        data_tests: [not_null]
      - name: first_answer_at
        description: Creation time of the earliest answer; null when unanswered.

  - name: int_question_tags
    description: One row per (question, current tag).
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(question_id as string), '|', tag)"
    columns:
      - name: tag
        data_tests: [not_null]
