version: 2

models:
  - name: int_questions
    description: >
      One row per question with the fields every prompt shares. Partitioned by creation_year. Outcome definitions
      follow specs/000: answered = at least one answer; accepted = `accepted_answer_id` is not null.
    columns:
      - name: question_id
        data_tests: [unique, not_null]
      - name: creation_year
        data_tests: [not_null]
      - name: tag_count
        description: Number of current tags (1–5; 119 legacy questions have 6).
      - name: answer_count
        description: The answer count used by every metric.
      - name: n_answers_joined
        description: Answers found in `posts_answers` for this question; must equal `answer_count` (AC-0.4).
      - name: is_answered
        data_tests: [not_null]
      - name: has_accepted_answer
        data_tests: [not_null]
      - name: first_answer_at
        description: Creation time of the earliest answer; null when unanswered.

  - name: int_question_tags
    description: One row per (question, current tag).
    data_tests:
      - unique:
          arguments:
            column_name: "concat(cast(question_id as string), '|', tag)"
    columns:
      - name: tag
        data_tests: [not_null]

  - name: int_question_tag_pairs
    description: One row per (question, unordered pair of current tags), stored alphabetically (tag_a < tag_b).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [question_id, tag_a, tag_b]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "tag_a < tag_b"

  - name: int_question_exposure
    description: >
      Leakage exposure (specs/000, AC-0.8/0.9): one row per question saying whether its tags, or its title/body, were
      first edited after its first answer. Reads revision metadata only, never `text`.
    columns:
      - name: question_id
        data_tests: [unique, not_null]
      - name: tags_exposed
        description: First tag edit (post_history types 6, 9) is later than the first answer. False when unanswered.
        data_tests: [not_null]
      - name: text_exposed
        description: First title/body edit (types 4, 5, 7, 8) is later than the first answer. False when unanswered.
        data_tests: [not_null]

  - name: int_question_window30
    description: >
      The 30-day-window outcomes of 2021-2022 questions (specs/001 "Metrics", censoring): answers and acceptance counted
      only within 30 days of the question, and whether the question had the full window.
    data_tests:
      - unique:
          arguments:
            column_name: question_id
      - dbt_utils.expression_is_true:
          arguments:
            expression: "answers_30d <= answer_count and (not accepted_30d or has_accepted_answer)"
          config:
            meta: {spec: "001 Metrics (30-day window)"}
    columns:
      - name: has_full_window
        data_tests: [not_null]

  - name: int_question_tags_30d
    description: int_question_tags with 30-day-window outcomes, full-window questions only.
  - name: int_question_tag_pairs_30d
    description: int_question_tag_pairs with 30-day-window outcomes, full-window questions only.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "tag_a < tag_b"

  - name: int_questions_original
    description: >
      int_questions with the ORIGINAL tags from the one-time text scan (needs_full_scan). Before 2018 only originally
      python-only / dbt-only questions have tags; from 2018 a question with no history row keeps its current tags.
    data_tests:
      - unique:
          arguments:
            column_name: question_id
  - name: int_question_original_tags
    description: One row per (question, original tag) for 2021-2022 (needs_full_scan).
  - name: int_question_original_tag_pairs
    description: One row per (question, unordered original tag pair) for 2021-2022 (needs_full_scan).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "tag_a < tag_b"

unit_tests:
  - name: exposure_counts_only_edits_after_the_first_answer
    description: >
      AC-0.9. Q1: tag edit after the first answer is exposed (tags only). Q2: body edit before the first answer is not
      exposed. Q3: a never-answered question cannot be exposed. Q4: a tag rollback after the first answer is exposed.
      Q5: title edit after the answer exposes the text, a tag edit before it does not expose the tags.
    model: int_question_exposure
    given:
      - input: ref('int_questions')
        rows:
          - {question_id: 1, creation_year: 2022, first_answer_at: "2022-01-02 00:00:00"}
          - {question_id: 2, creation_year: 2022, first_answer_at: "2022-01-02 00:00:00"}
          - {question_id: 3, creation_year: 2022, first_answer_at: null}
          - {question_id: 4, creation_year: 2022, first_answer_at: "2022-01-02 00:00:00"}
          - {question_id: 5, creation_year: 2022, first_answer_at: "2022-01-02 00:00:00"}
      - input: ref('stg_stackoverflow__post_history')
        rows:
          - {post_id: 1, post_history_type_id: 6, created_at: "2022-01-03 00:00:00"}
          - {post_id: 2, post_history_type_id: 5, created_at: "2022-01-01 00:00:00"}
          - {post_id: 3, post_history_type_id: 6, created_at: "2022-01-03 00:00:00"}
          - {post_id: 4, post_history_type_id: 9, created_at: "2022-01-05 00:00:00"}
          - {post_id: 5, post_history_type_id: 6, created_at: "2022-01-01 00:00:00"}
          - {post_id: 5, post_history_type_id: 4, created_at: "2022-01-04 00:00:00"}
    expect:
      rows:
        - {question_id: 1, tags_exposed: true, text_exposed: false}
        - {question_id: 2, tags_exposed: false, text_exposed: false}
        - {question_id: 3, tags_exposed: false, text_exposed: false}
        - {question_id: 4, tags_exposed: true, text_exposed: false}
        - {question_id: 5, tags_exposed: false, text_exposed: true}
