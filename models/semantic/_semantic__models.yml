      - name: creation_year
        type: categorical
      - name: tag_a
        type: categorical
      - name: tag_b
        type: categorical
    measures:
      - name: by_pair_orig_questions
        agg: count
        expr: question_id
        create_metric: true
      - name: by_pair_orig_answered_questions
        agg: sum
        expr: answered_flag
        create_metric: true
      - name: by_pair_orig_accepted_questions
        agg: sum
        expr: accepted_flag
        create_metric: true
      - name: by_pair_orig_answers
        agg: sum
        expr: answer_count
        create_metric: true

  - name: questions_original
    description: One row per question with the original tag string, 2013-2022 (sem_questions_original). For P2 use tags = python or dbt.
    model: ref('sem_questions_original')
    defaults:
      agg_time_dimension: created_at
    entities:
      - name: question_original
        type: primary
        expr: "question_id"
    dimensions:
