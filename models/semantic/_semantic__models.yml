        create_metric: true

  # --- Original-tags variant (specs/000 AC-0.10, specs/001 AC-1.9, specs/002 AC-2.6): the same definitions on the tags as first
  # posted (post_history type 3, read once by the text scan). Prefixes by_tag_orig_ / by_pair_orig_ / orig_. P1 2021-2022,
  # P2 2013-2022. No tag exposure (it describes the current-tag history). Floor, bounds and ranks stay in the *_original marts.
  - name: question_tags_original
    description: One row per (question, original tag), 2021-2022 (sem_question_tags_original).
    model: ref('sem_question_tags_original')
    defaults:
      agg_time_dimension: created_at
    entities:
      - name: question_tag_original
        type: primary
        expr: "concat(cast(question_id as string), '|', tag)"
    dimensions:
      - name: created_at
        type: time
        type_params:
          time_granularity: day
      - name: creation_year
        type: categorical
      - name: tag
        type: categorical
    measures:
      - name: by_tag_orig_questions
        agg: count
        expr: question_id
        create_metric: true
      - name: by_tag_orig_answered_questions
        agg: sum
        expr: answered_flag
        create_metric: true
      - name: by_tag_orig_accepted_questions
        agg: sum
        expr: accepted_flag
        create_metric: true
      - name: by_tag_orig_answers
        agg: sum
        expr: answer_count
        create_metric: true

  - name: question_tag_pairs_original
    description: One row per (question, unordered pair of original tags), 2021-2022 (sem_question_tag_pairs_original).
    model: ref('sem_question_tag_pairs_original')
    defaults:
      agg_time_dimension: created_at
    entities:
      - name: question_pair_original
        type: primary
        expr: "concat(cast(question_id as string), '|', tag_a, '|', tag_b)"
    dimensions:
