      - name: creation_year
        type: categorical
      - name: tag
        type: categorical
    measures:
      - name: by_tag_30d_questions
        agg: count
        expr: question_id
        create_metric: true
      - name: by_tag_30d_answered_questions
        agg: sum
        expr: answered_flag
        create_metric: true
      - name: by_tag_30d_accepted_questions
        agg: sum
        expr: accepted_flag
        create_metric: true
      - name: by_tag_30d_answers
        agg: sum
        expr: answer_count
        create_metric: true

  - name: question_tag_pairs_30d
    description: One row per (question, unordered tag pair), 30-day window (sem_question_tag_pairs_30d).
    model: ref('sem_question_tag_pairs_30d')
    defaults:
