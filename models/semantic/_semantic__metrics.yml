version: 2

# Metrics (MetricFlow), defined once from the definitions table of specs/000. All of them are ratio metrics: the sum
# of the numerator divided by the sum of the denominator over whatever group the query asks for, which is the spec's
# rule "a ratio of the group's totals, never an average of per-question ratios". The counts they use are the measures
# of _semantic__models.yml (each measure is also a metric of the same name).
# Three families with the same six definitions: no prefix (whole questions), by_tag_, by_pair_.
# P3: rates per feature bucket (`p3_`) and per label level (`p3_label_`) at the end of this file.

metrics:
  # --- Whole questions ---------------------------------------------------------------------------------------------
  - name: answer_rate
    label: Answer rate
    description: Answered questions / questions.
    type: ratio
    type_params: {numerator: answered_questions, denominator: questions}
  - name: accepted_rate
    label: Accepted rate
    description: Questions with an accepted answer / all questions. The headline and ranking metric (D2, AC-0.5).
    type: ratio
    type_params: {numerator: accepted_questions, denominator: questions}
  - name: accepted_rate_among_answered
    label: Accepted rate among answered
    description: Accepted questions / answered questions. Shown beside the accepted rate, never ranked (D2, AC-0.5).
    type: ratio
    type_params: {numerator: accepted_questions, denominator: answered_questions}
  - name: answers_per_question
    label: Answers per question
    description: Total answers / total questions. The headline of P2 and of "most answers" in P1 (D3, AC-0.6).
    type: ratio
    type_params: {numerator: answers, denominator: questions}
  - name: questions_per_answer
    label: Questions per answer
    description: Total questions / total answers = 1 / answers per question. Shown once as "Q÷A = 1 / this" (D3, AC-0.6, AC-2.5).
    type: ratio
    type_params: {numerator: questions, denominator: answers}
  - name: tag_exposure
    label: Tag exposure
    description: Questions whose tags were first edited after the first answer / questions (leakage KPI, AC-0.8).
    type: ratio
    type_params: {numerator: tag_exposed_questions, denominator: questions}

  # --- Questions grouped by tag (P1 single tags; P2 with tag = python / dbt and tag_count = 1) ----------------------
  - name: by_tag_answer_rate
    label: Answer rate, by tag
    description: Answered questions / questions, per tag.
    type: ratio
    type_params: {numerator: by_tag_answered_questions, denominator: by_tag_questions}
  - name: by_tag_accepted_rate
    label: Accepted rate, by tag
    description: Questions with an accepted answer / all questions, per tag (D2).
    type: ratio
    type_params: {numerator: by_tag_accepted_questions, denominator: by_tag_questions}
  - name: by_tag_accepted_rate_among_answered
    label: Accepted rate among answered, by tag
    description: Accepted questions / answered questions, per tag (D2).
    type: ratio
    type_params: {numerator: by_tag_accepted_questions, denominator: by_tag_answered_questions}
  - name: by_tag_answers_per_question
    label: Answers per question, by tag
    description: Total answers / total questions, per tag (D3).
    type: ratio
    type_params: {numerator: by_tag_answers, denominator: by_tag_questions}
  - name: by_tag_questions_per_answer
    label: Questions per answer, by tag
    description: Total questions / total answers, per tag = 1 / answers per question (D3, AC-2.5).
    type: ratio
    type_params: {numerator: by_tag_questions, denominator: by_tag_answers}
  - name: by_tag_tag_exposure
    label: Tag exposure, by tag
    description: Questions whose tags were first edited after the first answer / questions, per tag (AC-0.8).
    type: ratio
    type_params: {numerator: by_tag_tag_exposed_questions, denominator: by_tag_questions}

  # --- Questions grouped by tag pair (P1 tag combinations) ---------------------------------------------------------
  - name: by_pair_answer_rate
    label: Answer rate, by tag pair
    description: Answered questions / questions, per tag pair.
    type: ratio
    type_params: {numerator: by_pair_answered_questions, denominator: by_pair_questions}
  - name: by_pair_accepted_rate
    label: Accepted rate, by tag pair
    description: Questions with an accepted answer / all questions, per tag pair (D2).
    type: ratio
    type_params: {numerator: by_pair_accepted_questions, denominator: by_pair_questions}
  - name: by_pair_accepted_rate_among_answered
    label: Accepted rate among answered, by tag pair
    description: Accepted questions / answered questions, per tag pair (D2).
    type: ratio
    type_params: {numerator: by_pair_accepted_questions, denominator: by_pair_answered_questions}
  - name: by_pair_answers_per_question
    label: Answers per question, by tag pair
    description: Total answers / total questions, per tag pair (D3).
    type: ratio
    type_params: {numerator: by_pair_answers, denominator: by_pair_questions}
  - name: by_pair_questions_per_answer
    label: Questions per answer, by tag pair
    description: Total questions / total answers, per tag pair = 1 / answers per question (D3).
    type: ratio
    type_params: {numerator: by_pair_questions, denominator: by_pair_answers}
  - name: by_pair_tag_exposure
    label: Tag exposure, by tag pair
    description: Questions whose tags were first edited after the first answer / questions, per tag pair (AC-0.8).
    type: ratio
    type_params: {numerator: by_pair_tag_exposed_questions, denominator: by_pair_questions}

  # --- 30-day-window variant (same four definitions; see the semantic models for what changes) -------------------------
  - name: by_tag_30d_answer_rate
    label: Answer rate, by tag, 30-day window
    description: Answer rate within 30 days of the question, over questions that had the full window.
    type: ratio
    type_params: {numerator: by_tag_30d_answered_questions, denominator: by_tag_30d_questions}
  - name: by_tag_30d_accepted_rate
    label: Accepted rate, by tag, 30-day window
    description: Accepted rate within 30 days of the question, over questions that had the full window.
    type: ratio
    type_params: {numerator: by_tag_30d_accepted_questions, denominator: by_tag_30d_questions}
  - name: by_tag_30d_accepted_rate_among_answered
    label: Accepted rate among answered, by tag, 30-day window
    description: Accepted rate among answered within 30 days of the question, over questions that had the full window.
    type: ratio
    type_params: {numerator: by_tag_30d_accepted_questions, denominator: by_tag_30d_answered_questions}
  - name: by_tag_30d_answers_per_question
    label: Answers per question, by tag, 30-day window
    description: Answers per question within 30 days of the question, over questions that had the full window.
    type: ratio
    type_params: {numerator: by_tag_30d_answers, denominator: by_tag_30d_questions}

  - name: by_pair_30d_answer_rate
    label: Answer rate, by tag pair, 30-day window
    description: Answer rate within 30 days of the question, over questions that had the full window.
    type: ratio
    type_params: {numerator: by_pair_30d_answered_questions, denominator: by_pair_30d_questions}
  - name: by_pair_30d_accepted_rate
    label: Accepted rate, by tag pair, 30-day window
    description: Accepted rate within 30 days of the question, over questions that had the full window.
    type: ratio
    type_params: {numerator: by_pair_30d_accepted_questions, denominator: by_pair_30d_questions}
  - name: by_pair_30d_accepted_rate_among_answered
    label: Accepted rate among answered, by tag pair, 30-day window
    description: Accepted rate among answered within 30 days of the question, over questions that had the full window.
    type: ratio
    type_params: {numerator: by_pair_30d_accepted_questions, denominator: by_pair_30d_answered_questions}
  - name: by_pair_30d_answers_per_question
    label: Answers per question, by tag pair, 30-day window
    description: Answers per question within 30 days of the question, over questions that had the full window.
    type: ratio
    type_params: {numerator: by_pair_30d_answers, denominator: by_pair_30d_questions}

  # --- Original-tags variant (same four definitions; Q÷A too for the whole-question family, which P2 quotes) -------------
  - name: by_tag_orig_answer_rate
    label: Answer rate, by tag, original tags
    description: Answer rate computed on the tags as first posted (post_history type 3).
    type: ratio
    type_params: {numerator: by_tag_orig_answered_questions, denominator: by_tag_orig_questions}
  - name: by_tag_orig_accepted_rate
    label: Accepted rate, by tag, original tags
    description: Accepted rate computed on the tags as first posted (post_history type 3).
    type: ratio
    type_params: {numerator: by_tag_orig_accepted_questions, denominator: by_tag_orig_questions}
  - name: by_tag_orig_accepted_rate_among_answered
    label: Accepted rate among answered, by tag, original tags
    description: Accepted rate among answered computed on the tags as first posted (post_history type 3).
    type: ratio
    type_params: {numerator: by_tag_orig_accepted_questions, denominator: by_tag_orig_answered_questions}
  - name: by_tag_orig_answers_per_question
    label: Answers per question, by tag, original tags
    description: Answers per question computed on the tags as first posted (post_history type 3).
    type: ratio
    type_params: {numerator: by_tag_orig_answers, denominator: by_tag_orig_questions}

  - name: by_pair_orig_answer_rate
    label: Answer rate, by tag pair, original tags
    description: Answer rate computed on the tags as first posted (post_history type 3).
    type: ratio
    type_params: {numerator: by_pair_orig_answered_questions, denominator: by_pair_orig_questions}
  - name: by_pair_orig_accepted_rate
    label: Accepted rate, by tag pair, original tags
    description: Accepted rate computed on the tags as first posted (post_history type 3).
    type: ratio
    type_params: {numerator: by_pair_orig_accepted_questions, denominator: by_pair_orig_questions}
  - name: by_pair_orig_accepted_rate_among_answered
    label: Accepted rate among answered, by tag pair, original tags
    description: Accepted rate among answered computed on the tags as first posted (post_history type 3).
    type: ratio
    type_params: {numerator: by_pair_orig_accepted_questions, denominator: by_pair_orig_answered_questions}
  - name: by_pair_orig_answers_per_question
    label: Answers per question, by tag pair, original tags
    description: Answers per question computed on the tags as first posted (post_history type 3).
    type: ratio
    type_params: {numerator: by_pair_orig_answers, denominator: by_pair_orig_questions}

  - name: orig_answer_rate
    label: Answer rate, original tags
    description: Answer rate computed on the tags as first posted (post_history type 3).
    type: ratio
    type_params: {numerator: orig_answered_questions, denominator: orig_questions}
  - name: orig_accepted_rate
    label: Accepted rate, original tags
    description: Accepted rate computed on the tags as first posted (post_history type 3).
    type: ratio
    type_params: {numerator: orig_accepted_questions, denominator: orig_questions}
  - name: orig_accepted_rate_among_answered
    label: Accepted rate among answered, original tags
    description: Accepted rate among answered computed on the tags as first posted (post_history type 3).
    type: ratio
    type_params: {numerator: orig_accepted_questions, denominator: orig_answered_questions}
  - name: orig_answers_per_question
    label: Answers per question, original tags
    description: Answers per question computed on the tags as first posted (post_history type 3).
    type: ratio
    type_params: {numerator: orig_answers, denominator: orig_questions}
  - name: orig_questions_per_answer
    label: Questions per answer, original tags
    description: Questions per answer computed on the tags as first posted (post_history type 3).
    type: ratio
    type_params: {numerator: orig_questions, denominator: orig_answers}

  # --- P3 (Item 6): rates per feature bucket and per quality-label level -------------------------------------------
  # Group by `feature` and `bucket` (filter `version` and `creation_year`); the effect of a bucket is the difference
  # between its rate and the rate of the reference bucket '1:', which the marts compute with margins and controls.
  - name: p3_answer_rate
    label: Answer rate, rule-based bucket
    description: Answered questions / questions, per feature bucket.
    type: ratio
    type_params: {numerator: p3_answered_questions, denominator: p3_questions}
  - name: p3_accepted_rate
    label: Accepted rate, rule-based bucket
    description: Questions with an accepted answer / all questions, per feature bucket (D2, AC-0.5).
    type: ratio
    type_params: {numerator: p3_accepted_questions, denominator: p3_questions}
  - name: p3_accepted_rate_among_answered
    label: Accepted rate among answered, rule-based bucket
    description: Accepted questions / answered questions, per feature bucket.
    type: ratio
    type_params: {numerator: p3_accepted_questions, denominator: p3_answered_questions}
  - name: p3_label_answer_rate
    label: Answer rate, quality-label level
    description: Answered questions / questions, per label level.
    type: ratio
    type_params: {numerator: p3_label_answered_questions, denominator: p3_label_questions}
  - name: p3_label_accepted_rate
    label: Accepted rate, quality-label level
    description: Questions with an accepted answer / all questions, per label level (D2, AC-0.5).
    type: ratio
    type_params: {numerator: p3_label_accepted_questions, denominator: p3_label_questions}
  - name: p3_label_accepted_rate_among_answered
    label: Accepted rate among answered, quality-label level
    description: Accepted questions / answered questions, per label level.
    type: ratio
    type_params: {numerator: p3_label_accepted_questions, denominator: p3_label_answered_questions}

